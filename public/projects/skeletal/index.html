<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Inktober 2025 - Day 28</title>
  <style>
    :root { --bg: #0b0b10; --fg: #ffffff; }
    html, body {
      height: 100%; margin: 0;
      background: radial-gradient(1200px 600px at 70% -200px, #15151d 0%, var(--bg) 60%);
      overflow: hidden; color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    #scene { position: fixed; inset: 0; }
    #scene canvas { width: 100% !important; height: 100% !important; display: block; background: transparent; cursor: crosshair; touch-action: none; }
    @media (pointer: coarse) { #scene canvas { cursor: default; } }
  </style>
</head>
<body>
  <div id="scene" aria-label="Responsive bone rain simulation"></div>

  <!-- Matter.js -->
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script>
  (function(){
    'use strict';
    // ======================== RESPONSIVE + PERF ==============================

    const svgToURI = (svg) => `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;

    // ---- SVGs (no filters, refined silhouettes) -------------------------
    // Femur — 96x32
    const femurSVG = () => `
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 32' width='96' height='32'>
      <g fill='#fff'>
        <circle cx='16' cy='16' r='9'/>
        <path d='M22 10c5 2 10 4 14 7c1 1 1 3 0 4c-4 3-9 5-14 7c-3 1-9 0-10-3c0-1 0-2 1-3c2-6 5-9 9-12z'/>
        <rect x='34' y='9' width='32' height='14' rx='7' ry='7'/>
        <path d='M68 9c8 0 14 6 14 11s-6 11-14 11c-7 0-12-4-12-9s5-13 12-13z'/>
        <path d='M78 11c6 0 10 5 10 9s-4 9-10 9c-5 0-8-3-8-7s3-11 8-11z'/>
      </g>
    </svg>`;

    // Tibia — 26x96
    const tibiaSVG = () => `
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 96' width='26' height='96'>
      <g fill='#fff'>
        <path d='M3 14c0-7 6-12 10-12s10 5 10 12c0 6-5 10-10 10S3 20 3 14z'/>
        <path d='M9 24c3-1 5-1 8 0v4c-3 1-5 1-8 0z'/>
        <path d='M7 30c0-2 3-3 6-3s6 1 6 3v46c0 2-3 3-6 3s-6-1-6-3z'/>
        <path d='M6 74c-1 0-2 1-2 2v3c0 6 4 11 10 11s10-5 10-11v-3c0-1-1-2-2-2H6z'/>
        <path d='M8 84c0 5 3 9 6 9 5 0 7-4 7-9z'/>
      </g>
    </svg>`;

    // Skull — 64x68
    const skullSVG = () => `
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 68' width='64' height='68'>
      <g>
        <path fill='#fff' fill-rule='evenodd' d='
          M32 4c-14 0-26 12-26 26 0 9 6 17 12 20v9h7v-6h4v6h7v-6h4v6h7v-9c6-3 12-11 12-20 0-14-12-26-26-26z
          M20 28a6 6 0 1 0 0.01 0zm24 0a6 6 0 1 0 0.01 0zm-12 14c-3 0-5 2-5 4h10c0-2-2-4-5-4z' />
      </g>
    </svg>`;

    const BASE_TYPES = [
      { name: 'femur',  w: 96, h: 32,  svg: femurSVG, hitScale: 0.9 },
      { name: 'tibia',  w: 26, h: 96,  svg: tibiaSVG, hitScale: 0.9 },
      { name: 'crane',  w: 64, h: 68,  svg: skullSVG, hitScale: 0.9 },
    ];

    // --------- Simple device profiling -----------------------------------
    function getProfile() {
      const mmCoarse = matchMedia('(pointer: coarse)').matches;
      const smallW = window.innerWidth <= 480;
      const shortH = window.innerHeight <= 540;
      const weakCPU = (navigator.hardwareConcurrency || 4) <= 4;
      const lowMem = (navigator.deviceMemory || 4) <= 4;
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const isMobile = mmCoarse || smallW || shortH;

      // defaults (desktop)
      let profile = {
        sizeScale: 1.0,
        maxBones: 160,
        rain: 220,
        pushR: 76,
        posIter: 6,
        velIter: 4
      };

      if (isMobile) {
        profile.sizeScale = 0.92;
        profile.maxBones = 120;
        profile.rain = 280;
        profile.pushR = 64;
        profile.posIter = 5;
        profile.velIter = 3;
      }
      if (weakCPU || lowMem) {
        profile.maxBones = Math.min(profile.maxBones, 120);
        profile.rain = Math.max(profile.rain, 300);
        profile.posIter = Math.min(profile.posIter, 5);
        profile.velIter = Math.min(profile.velIter, 3);
      }
      if (reduceMotion) {
        profile.maxBones = Math.min(profile.maxBones, 100);
        profile.rain = Math.max(profile.rain, 340);
      }
      return profile;
    }

    // --------- Matter.js init -----------------------------------------------
    const { Engine, Render, Runner, Bodies, Body, World, Events, Query } = Matter;
    const sceneEl = document.getElementById('scene');

    const engine = Engine.create({ enableSleeping: true });
    const world = engine.world;
    world.gravity.y = 1.12;

    const render = Render.create({
      element: sceneEl,
      engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        background: 'transparent',
        wireframes: false,
        pixelRatio: 1
      }
    });
    Render.run(render);
    const ctx = render.context; if (ctx) ctx.imageSmoothingEnabled = false;
    const runner = Runner.create();
    Runner.run(runner, engine);

    // Bounds
    let floor, leftWall, rightWall;
    const WALL_THICK = 200;
    function addBounds() {
      const w = render.options.width; const h = render.options.height;
      floor = Bodies.rectangle(w/2, h + WALL_THICK/2 - 2, w + WALL_THICK*2, WALL_THICK, { isStatic: true, friction: 1, render: { fillStyle: 'transparent' } });
      leftWall = Bodies.rectangle(-WALL_THICK/2, h/2, WALL_THICK, h*2, { isStatic: true, render: { fillStyle: 'transparent' } });
      rightWall = Bodies.rectangle(w + WALL_THICK/2, h/2, WALL_THICK, h*2, { isStatic: true, render: { fillStyle: 'transparent' } });
      World.add(world, [floor, leftWall, rightWall]);
    }
    function removeBounds(){ if (floor) World.remove(world, floor); if (leftWall) World.remove(world, leftWall); if (rightWall) World.remove(world, rightWall); }
    addBounds();

    // --------- Current profile + helpers -------------------------------------
    let profile = getProfile();
    engine.positionIterations = profile.posIter;
    engine.velocityIterations = profile.velIter;

    function setRainInterval(ms){
      if (ms === RAIN_INTERVAL) return;
      RAIN_INTERVAL = ms; clearInterval(rainTimer); rainTimer = setInterval(spawnBone, RAIN_INTERVAL);
    }

    function scaledTypes(scale){
      return BASE_TYPES.map(t => ({ ...t, w: t.w, h: t.h, svg: t.svg, hitScale: t.hitScale, spriteScale: scale }));
    }

    let BONE_TYPES = scaledTypes(profile.sizeScale);

    // --------- Bone rain ----------------------------------------------------
    const bones = [];
    let MAX_BONES_LIMIT = profile.maxBones;

    const rnd = (min, max) => Math.random() * (max - min) + min;
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    function makeBone(type, x, y) {
      const scale = (type.hitScale || 1) * (type.spriteScale || 1);
      const bw = type.w * scale;
      const bh = type.h * scale;
      const body = Bodies.rectangle(x, y, bw, bh, {
        restitution: 0.01,
        friction: 0.97,
        frictionStatic: 0.99,
        frictionAir: 0.025,
        density: 0.0019,
        sleepThreshold: 15,
        render: {
          sprite: {
            texture: svgToURI(type.svg()),
            xScale: (type.spriteScale || 1),
            yScale: (type.spriteScale || 1)
          }
        }
      });
      Body.setAngle(body, rnd(-Math.PI, Math.PI));
      return body;
    }

    function spawnBone() {
      const w = render.options.width;
      const type = pick(BONE_TYPES);
      const pad = 32 * (type.spriteScale || 1);
      const x = rnd(pad, w - pad);
      const y = -56 * (type.spriteScale || 1);
      const b = makeBone(type, x, y);
      World.add(world, b);
      bones.push(b);
      if (bones.length > MAX_BONES_LIMIT) { const old = bones.shift(); World.remove(world, old); }
    }

    let RAIN_INTERVAL = profile.rain;
    let rainTimer = setInterval(spawnBone, RAIN_INTERVAL);

    // Interaction: only pushes nearby bones
    let PUSH_RADIUS = profile.pushR;
    const PUSH_STRENGTH = 0.00007;

    function pushFrom(x, y) {
      const r = PUSH_RADIUS;
      const region = { min: { x: x - r, y: y - r }, max: { x: x + r, y: y + r } };
      const nearby = Query.region(bones, region);
      for (let i = 0; i < nearby.length; i++) {
        const b = nearby[i];
        const dx = b.position.x - x;
        const dy = b.position.y - y;
        const d2 = dx*dx + dy*dy;
        if (d2 < r*r) {
          const d = Math.sqrt(d2) || 0.0001;
          const scale = (1 - d / r);
          const fx = (dx / d) * PUSH_STRENGTH * b.mass * (0.6 + 0.4*Math.random()) * scale;
          const fy = (dy / d) * PUSH_STRENGTH * b.mass * (0.6 + 0.4*Math.random()) * scale;
          Body.applyForce(b, b.position, { x: fx, y: fy });
          if (Math.random() < 0.25) Body.setAngularVelocity(b, (Math.random()-0.5) * 0.5);
        }
      }
    }

    function getCanvasXY(evt) {
      const rect = render.canvas.getBoundingClientRect();
      return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
    }

    render.canvas.addEventListener('pointermove', (e) => { const {x,y}=getCanvasXY(e); pushFrom(x,y); });
    render.canvas.addEventListener('touchmove', (e) => {
      for (const t of e.touches) { const rect = render.canvas.getBoundingClientRect(); pushFrom(t.clientX - rect.left, t.clientY - rect.top); }
    }, { passive: true });

    // Resize / orientation: recompute profile and adapt smoothly
    let resizeTO = null;
    function applyProfile(newP){
      profile = newP;
      engine.positionIterations = profile.posIter;
      engine.velocityIterations = profile.velIter;
      setRainInterval(profile.rain);
      PUSH_RADIUS = profile.pushR;
      MAX_BONES_LIMIT = profile.maxBones;
      BONE_TYPES = scaledTypes(profile.sizeScale);
    }

    function handleResize() {
      render.canvas.width = window.innerWidth;
      render.canvas.height = window.innerHeight;
      render.options.width = window.innerWidth;
      render.options.height = window.innerHeight;
      removeBounds(); addBounds();
      const newProfile = getProfile();
      applyProfile(newProfile);
    }
    window.addEventListener('resize', () => { clearTimeout(resizeTO); resizeTO = setTimeout(handleResize, 120); });
    window.addEventListener('orientationchange', () => { clearTimeout(resizeTO); resizeTO = setTimeout(handleResize, 120); });

    // Auto-throttle FPS (like v4)
    let fpsEMA = 60;
    Events.on(engine, 'afterUpdate', () => {
      const dt = engine.timing.lastDelta || 16.7; const fps = 1000 / dt; fpsEMA = fpsEMA * 0.9 + fps * 0.1;
      if (fpsEMA < 50) {
        setRainInterval(Math.max(300, RAIN_INTERVAL + 40));
        if (bones.length > MAX_BONES_LIMIT - 8) { for (let i = 0; i < 8 && bones.length; i++){ const old=bones.shift(); World.remove(world, old); } }
        MAX_BONES_LIMIT = Math.max(100, MAX_BONES_LIMIT - 1);
      } else if (fpsEMA > 58 && MAX_BONES_LIMIT < profile.maxBones) {
        setRainInterval(profile.rain);
        MAX_BONES_LIMIT += 1;
      }
      // Off-screen GC
      const h = render.options.height; const w = render.options.width;
      for (let i = bones.length - 1; i >= 0; i--) {
        const b = bones[i];
        if (b.position.y > h + 800 || Math.abs(b.position.x) > w + 800) { bones.splice(i, 1); World.remove(world, b); }
      }
    });

    // Initial seeding
    for (let i = 0; i < Math.min(16, MAX_BONES_LIMIT/8); i++) spawnBone();
  })();
  </script>
</body>
</html>
