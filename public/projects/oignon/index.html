<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fruit Ninja – Oignons</title>
  <style>
    :root{
      --bg0:#0b0f1a; /* nuit */
      --bg1:#12182a;
      --accent:#a20f6b; /* oignon rouge */
      --accent-2:#f2d6ea; /* clair */
      --good:#36d399;
      --bad:#ef4444;
      --spriteSize: clamp(72px, 12vw, 120px); /* taille de base responsive */
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 800px at 70% 20%, #1a2140, var(--bg0)) fixed;
      color:#e6e6e6;
      min-height:100svh; /* mobile viewport */
      overflow:hidden;
      user-select:none;
      cursor: crosshair;
    }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 800px at 70% 20%, #1a2140, var(--bg0)) fixed;
      color:#e6e6e6;
      overflow:hidden;
      user-select:none;
      cursor: crosshair;
    }
    #hud{
      position:fixed; left:calc(env(safe-area-inset-left) + 12px); top:calc(env(safe-area-inset-top) + 12px); z-index:10;
      display:flex; gap:10px; align-items:center;
      padding:10px 14px; border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.15);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      font-weight:600;
    }
    #hud .pill{padding:.25rem .6rem; border-radius:999px; background:#1f2937; font-variant-numeric:tabular-nums}
    #hud button{
      margin-left:6px; padding:.45rem .7rem; border-radius:10px; border:1px solid rgba(255,255,255,.16);
      background:#171c2b; color:#e6e6e6; font-weight:600; cursor:pointer;
    }
    #game{position:fixed; inset:0; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none;}

    /* Aide visuelle du plancher */
    #floor{position:absolute; left:0; right:0; bottom:0; height:40px; background:linear-gradient(180deg, transparent, rgba(255,255,255,.04)); pointer-events:none}

    /* Sprites (chaque oignon est un <div> contenant un <svg>) */
    .sprite{
      position:absolute; left:0; top:0; will-change: transform;
      transform: translate3d(-1000px,-1000px,0);
      touch-action:none;
    }
    .sprite svg{display:block; width:var(--spriteSize); height:auto; filter:url(#dropShadow);}
    .half svg{width:calc(var(--spriteSize) * 1.05)}

    /* Trace de coupe (petit flash) */
    .slash{
      position:absolute; width:140px; height:6px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent);
      border-radius:999px; pointer-events:none; opacity:0; transform-origin:50% 50%;
      box-shadow:0 0 18px rgba(255,255,255,.55);
    }
    .slash.show{animation: slash .3s ease-out forwards}
    @keyframes slash{from{opacity:1; transform:scaleX(.6)} to{opacity:0; transform:scaleX(1.4)}}

    /* Particules de jus */
    .particle{position:absolute; width:8px; height:8px; border-radius:50%; background: var(--accent-2); pointer-events:none; opacity:.85;}

    /* Combo flash */
    .comboFlash{position:absolute; font-weight:800; font-size:24px; color:#fff; letter-spacing:.5px; pointer-events:none; text-shadow:0 2px 10px rgba(0,0,0,.5); opacity:0; transform: translate(-50%,-30%) scale(.8);}
    .comboFlash.show{animation: comboPop .6s ease-out forwards}
    @keyframes comboPop{0%{opacity:0; transform: translate(-50%,-30%) scale(.8);}20%{opacity:1;}100%{opacity:0; transform: translate(-50%,-120%) scale(1.1);}}

    /* Écran start / game over minimal */
    #overlay{position:fixed; inset:0; display:grid; place-items:center; background:linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55)); z-index:20}
    #overlay.hidden{display:none}
    .card{padding:28px 26px; border-radius:16px; background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border:1px solid rgba(255,255,255,.16); text-align:center}
    .card h1{margin:0 0 6px; font-size:28px}
    .card p{margin:0 0 14px; opacity:.8}
    .card button{padding:.6rem 1rem; border-radius:12px; border:1px solid rgba(255,255,255,.2); background:#1a2033; color:#fff; font-weight:700; cursor:pointer}

    @media (prefers-reduced-motion: reduce){
      .slash, .particle{display:none}
    }

    /* Mobile/coarse pointer tweaks */
    @media (pointer: coarse){
      :root{ --spriteSize: clamp(84px, 20vw, 160px); }
      body{ cursor: default; }
      #hud .pill{ font-size:1.05rem }
      #hud button{ padding:.6rem .9rem }
    }

    /* Mobile landscape: plus difficile (oignons + HUD plus petits) */
    @media (pointer: coarse) and (orientation: landscape){
      :root{ --spriteSize: clamp(64px, 12vw, 110px); }
      #hud{ padding:6px 8px; gap:8px; }
      #hud .pill{ font-size:.9rem; padding:.2rem .5rem }
      #hud button{ padding:.4rem .6rem; font-size:.9rem }
    }


    /* Mobile/coarse pointer tweaks */
    @media (pointer: coarse){
      :root{ --spriteSize: clamp(84px, 20vw, 160px); }
      body{ cursor: default; }
      #hud .pill{ font-size:1.05rem }
      #hud button{ padding:.6rem .9rem }
    }
  </style>
</head>
<body>
  <div id="hud">
    <span>Score</span><span id="score" class="pill">0</span>
    <span>Combo</span><span id="combo" class="pill">×1</span>
    <span>Temps</span><span id="timer" class="pill">01:00</span>
    <button id="reset" title="Recommencer (R)">↺</button>
  </div>

  <div id="game" aria-label="Terrain de jeu des oignons"></div>
  <div id="floor"></div>

  <!-- Overlay start -->
  <div id="overlay" role="dialog" aria-modal="true">
    <div class="card">
      <h1>Fruit Ninja : Oignons</h1>
      <p>Clique sur les oignons pour les couper en deux. Prêt ?</p>
      <button id="start">Jouer</button>
    </div>
  </div>

  <!-- Définitions SVG réutilisables -->
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <!-- Ombre portée -->
      <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.45" />
      </filter>

      <!-- Dégradés de l'oignon entier -->
      <radialGradient id="gradOnion" cx="50%" cy="38%" r="60%">
        <stop offset="0%" stop-color="#f4d8ec"/>
        <stop offset="55%" stop-color="#d177b1"/>
        <stop offset="100%" stop-color="#7d0e58"/>
      </radialGradient>
      <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#bb2a82"/>
        <stop offset="100%" stop-color="#6e0a4b"/>
      </linearGradient>

      <!-- Symbol: Oignon entier -->
      <symbol id="onion-whole" viewBox="0 0 120 140">
        <!-- Corps -->
        <path d="M60 10 C 48 20 42 34 38 48 C 34 62 32 76 34 92 C 36 108 44 122 60 134 C 76 122 84 108 86 92 C 88 76 86 62 82 48 C 78 34 72 20 60 10 Z" fill="url(#gradOnion)" stroke="#5a0b3d" stroke-width="2"/>
        <!-- Peau bord -->
        <path d="M60 16 C 50 24 46 36 42 50 C 38 64 37 79 39 94 C 48 116 60 126 60 126 C 60 126 72 116 81 94 C 83 79 82 64 78 50 C 74 36 70 24 60 16 Z" fill="url(#skin)" fill-opacity=".25"/>
        <!-- Reflet -->
        <ellipse cx="48" cy="48" rx="16" ry="22" fill="url(#gloss)" transform="rotate(-20 48 48)" opacity=".35"/>
        <!-- Tige -->
        <path d="M59 9 C 57 5 56 2 58 0 C 60 -1 63 2 64 6 C 65 10 64 14 63 18 C 61 15 60 12 59 9 Z" fill="#4caf50"/>
        <!-- Filaments racinaires -->
        <g stroke="#c9a7b8" stroke-width="1.2" stroke-linecap="round">
          <path d="M58 134 Q 56 138 52 140"/>
          <path d="M60 134 Q 60 138 60 141"/>
          <path d="M62 134 Q 66 138 70 140"/>
        </g>
      </symbol>

      <!-- Symbol: moitiés (gauche / droite) avec face coupée -->
      <symbol id="onion-half-left" viewBox="0 0 120 140">
        <!-- coque extérieure, moitié gauche -->
        <path d="M60 10 C 48 20 42 34 38 48 C 34 62 32 76 34 92 C 36 108 44 122 60 134 L 60 10 Z" fill="url(#skin)"/>
        <!-- face coupée (anneaux) -->
        <g transform="translate(60, 70)">
          <ellipse cx="0" cy="0" rx="34" ry="46" fill="#f6e6f1" stroke="#b76a9c" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="26" ry="38" fill="none" stroke="#c989b1" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="18" ry="28" fill="none" stroke="#d9a5c4" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="10" ry="16" fill="none" stroke="#eac4da" stroke-width="2"/>
        </g>
        <!-- tige coupée -->
        <rect x="58" y="6" width="6" height="16" rx="3" fill="#6bcf6b"/>
      </symbol>

      <symbol id="onion-half-right" viewBox="0 0 120 140">
        <!-- coque extérieure, moitié droite -->
        <path d="M60 10 C 72 20 78 34 82 48 C 86 62 88 76 86 92 C 84 108 76 122 60 134 L 60 10 Z" fill="url(#skin)"/>
        <!-- face coupée (anneaux) -->
        <g transform="translate(60, 70)">
          <ellipse cx="0" cy="0" rx="34" ry="46" fill="#f6e6f1" stroke="#b76a9c" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="26" ry="38" fill="none" stroke="#c989b1" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="18" ry="28" fill="none" stroke="#d9a5c4" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="10" ry="16" fill="none" stroke="#eac4da" stroke-width="2"/>
        </g>
        <!-- tige coupée -->
        <rect x="56" y="6" width="6" height="16" rx="3" fill="#6bcf6b"/>
      </symbol>
    </defs>
  </svg>

  <script>
  // --- Utilitaires DOM ---
  const $ = (sel, el=document) => el.querySelector(sel);
  const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];

  // --- Constantes du jeu ---
  const gameEl = document.getElementById('game');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const timerEl = document.getElementById('timer');
  const overlayEl = document.getElementById('overlay');
  const startBtn = document.getElementById('start');
  const resetBtn = document.getElementById('reset');

  const G = 1800; // gravité px/s^2
  const SPAWN_EVERY_MIN = 460; // ms
  const SPAWN_EVERY_MAX = 800; // ms
  const THROW_VX = 400; // amplitude horizontale max
  const ROT_MIN = -170, ROT_MAX = 170; // °/s
  const SCALE_MIN = 0.80, SCALE_MAX = 1.35; // variations de taille
  const ROUND_MS = 60_000; // 1 minute
  const COMBO_WINDOW = 800; // ms pour enchaîner
  const COMBO_MAX = 5;

  const APEX_MIN_F = 0.12; // haut
  const APEX_MAX_F = 0.42;

  let W = window.innerWidth;
  let H = window.innerHeight;

  // Variétés d'oignons via filtres CSS
  const VARIETIES = [
    { name:'rouge', filter:'none' },
    { name:'jaune', filter:'hue-rotate(-45deg) saturate(120%) brightness(105%)' },
    { name:'blanc', filter:'hue-rotate(20deg) saturate(35%) brightness(125%) contrast(105%)' },
    { name:'vert',  filter:'hue-rotate(95deg) saturate(130%) brightness(108%)' },
  ];

  const state = {
    running: false,
    entities: [], // {el, x,y, vx,vy, rot, vrot, sx, sy, type, filterCss}
    score: 0,
    lastTime: 0,
    nextSpawnAt: 0,
    endsAt: 0,
    comboMult: 1,
    comboLast: 0,
    bestCombo: 1,
  };

  const isCoarse = matchMedia('(pointer: coarse)').matches;

  function rand(a,b){return a + Math.random()*(b-a)}
  function randInt(a,b){return Math.floor(rand(a,b))}
  function clamp(v,a,b){return Math.max(a, Math.min(b,v))}

  // Convertit une fraction d'écran f (0..1) en vitesse verticale initiale
  // pour que l'apex atteigne y = H*f
  function vyForApexFraction(f){
    const y0 = H + 120; // départ sous l'écran
    const yApex = H * f;
    const s = (y0 - yApex); // déplacement vers le haut (positif)
    const vy = -Math.sqrt(2 * G * s);
    return vy;
  }

  // --- Création des sprites ---
  function makeSprite(symbolId, klass=""){
    const wrapper = document.createElement('div');
    wrapper.className = `sprite ${klass}`.trim();
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 120 140');
    svg.setAttribute('aria-hidden','true');
    const use = document.createElementNS('http://www.w3.org/2000/svg','use');
    use.setAttributeNS('http://www.w3.org/1999/xlink','href',`#${symbolId}`);
    svg.appendChild(use);
    wrapper.appendChild(svg);
    return wrapper;
  }

  function addEntity(symbolId, type, x, y, vx, vy, rot, vrot, sx, sy, filterCss){
    const el = makeSprite(symbolId, type.includes('half') ? 'half' : '');
    gameEl.appendChild(el);
    const e = { el, x, y, vx, vy, rot, vrot, sx, sy, type, filterCss: filterCss || 'none' };
    el.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${sx}, ${sy})`;
    el.style.filter = e.filterCss; // recolor variété
    if(type === 'whole'){
      el.addEventListener('pointerdown', () => onHit(e)); // tap pour mobile
    }
    state.entities.push(e);
    return e;
  }

  function spawnOnion(){
    if(!state.running) return;
    const wholeCount = state.entities.filter(e=>e.type==='whole').length;
    if(wholeCount >= 7) return;
    const sideMargin = Math.min(220, W*0.18);
    const x = rand(sideMargin, W - sideMargin);
    const y = H + 120; // sous l'écran
    const vx = rand(-THROW_VX, THROW_VX);

    // Choisir un apex entre ~12% et 42% de l'écran (plus haut)
    const apexF = rand(APEX_MIN_F, APEX_MAX_F);
    let vy = vyForApexFraction(apexF) * rand(0.97, 1.05);

    const rot = rand(0,360);
    const vrot = rand(ROT_MIN, ROT_MAX);

    // Variations de taille et rondeur (plus rond en général)
    const scale = rand(SCALE_MIN, SCALE_MAX);
    const anisotropy = rand(0.04, 0.18); // élargit un peu (rond)
    const sx = scale * (1 + anisotropy);
    const sy = scale * (1 - anisotropy * 0.6);

    const variety = VARIETIES[randInt(0, VARIETIES.length)];
    addEntity('onion-whole','whole', x, y, vx, vy, rot, vrot, sx, sy, variety.filter);
  }

  // --- Découpe (tap + swipe) ---
  function onHit(entity){
    if(entity.type !== 'whole') return;
    // Haptique légère sur mobile
    if(navigator.vibrate){ try{ navigator.vibrate(10); }catch(_){} }

    const now = performance.now();

    // Combo logic
    if(now - state.comboLast <= COMBO_WINDOW){
      state.comboMult = Math.min(COMBO_MAX, state.comboMult + 1);
    } else {
      state.comboMult = 1;
    }
    state.comboLast = now;
    state.bestCombo = Math.max(state.bestCombo, state.comboMult);
    comboEl.textContent = `×${state.comboMult}`;

    // Score + effets
    bumpScore(state.comboMult);
    showSlash(entity.x, entity.y, entity.rot);
    showComboFlash(entity.x, entity.y, state.comboMult);
    splash(entity.x, entity.y, 10);

    // Retire l'oignon entier
    removeEntity(entity);

    // Ajoute deux moitiés avec un petit écart
    const base = 240;
    const left = addEntity('onion-half-left','half-left', entity.x, entity.y, entity.vx - rand(160, base), entity.vy - rand(40,160), entity.rot - rand(0,25), entity.vrot - rand(40,90), entity.sx, entity.sy, entity.filterCss);
    const right = addEntity('onion-half-right','half-right', entity.x, entity.y, entity.vx + rand(160, base), entity.vy - rand(40,160), entity.rot + rand(0,25), entity.vrot + rand(40,90), entity.sx, entity.sy, entity.filterCss);

    // Les moitiés ne sont pas cliquables
    left.el.style.pointerEvents = 'none';
    right.el.style.pointerEvents = 'none';
  }

  // test d'impact au point (pour tap)
  function trySliceAt(x,y){
    for(let i=state.entities.length-1;i>=0;i--){
      const e = state.entities[i];
      if(e.type !== 'whole') continue;
      const r = 54 * ((e.sx + e.sy)/2); // rayon tolérant
      const dx = x - e.x, dy = y - e.y;
      if((dx*dx + dy*dy) <= r*r){ onHit(e); }
    }
  }

  // test d'impact le long d'un segment (pour swipe)
  function sweepSlice(x0,y0,x1,y1){
    const segLen2 = (x1-x0)*(x1-x0) + (y1-y0)*(y1-y0);
    if(segLen2 < 9) { trySliceAt(x1,y1); return; }
    for(let i=state.entities.length-1;i>=0;i--){
      const e = state.entities[i];
      if(e.type !== 'whole') continue;
      const r = 50 * ((e.sx + e.sy)/2);
      if(distToSegmentSq(e.x,e.y,x0,y0,x1,y1) <= r*r){ onHit(e); }
    }
  }

  function distToSegmentSq(px,py, x1,y1,x2,y2){
    const vx = x2-x1, vy = y2-y1;
    const wx = px-x1, wy = py-y1;
    const c1 = vx*wx + vy*wy;
    if(c1 <= 0) return wx*wx + wy*wy;
    const c2 = vx*vx + vy*vy;
    if(c2 <= c1) { const dx=px-x2, dy=py-y2; return dx*dx + dy*dy; }
    const b = c1 / c2;
    const bx = x1 + b*vx, by = y1 + b*vy;
    const dx = px - bx, dy = py - by;
    return dx*dx + dy*dy;
  }

  // trace visuelle de la lame
  function showBladeSegment(x0,y0,x1,y1){
    const dx = x1-x0, dy = y1-y0;
    const len = Math.hypot(dx,dy);
    const ang = Math.atan2(dy,dx) * 180/Math.PI;
    const midx = (x0+x1)/2, midy = (y0+y1)/2;
    const s = document.createElement('div');
    s.className = 'slash show';
    s.style.width = `${Math.max(24, len)}px`;
    s.style.left = (midx - Math.max(24, len)/2) + 'px';
    s.style.top = (midy - 3) + 'px';
    s.style.transform = `rotate(${ang}deg)`;
    gameEl.appendChild(s);
    setTimeout(()=>s.remove(), 320);
  }

  // --- Particules ---
  function bumpScore(n){ state.score += n; scoreEl.textContent = state.score; }

  function removeEntity(e){
    const i = state.entities.indexOf(e);
    if(i>=0){ state.entities.splice(i,1); }
    e.el?.remove();
  }

  function showSlash(x,y,rot){
    const s = document.createElement('div');
    s.className = 'slash show';
    s.style.left = (x-70) + 'px';
    s.style.top = (y-3) + 'px';
    s.style.transform = `rotate(${rot + rand(-35,35)}deg)`;
    gameEl.appendChild(s);
    setTimeout(()=>s.remove(), 320);
  }

  function showComboFlash(x,y,m){
    if(m <= 1) return;
    const d = document.createElement('div');
    d.className = 'comboFlash show';
    d.textContent = `×${m}`;
    d.style.left = `${x}px`;
    d.style.top = `${y}px`;
    gameEl.appendChild(d);
    setTimeout(()=>d.remove(), 650);
  }

  function splash(x,y,count){
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const ox = rand(-8,8), oy = rand(-8,8);
      p.style.left = (x+ox)+'px';
      p.style.top  = (y+oy)+'px';
      gameEl.appendChild(p);
      const ang = rand(0, Math.PI*2);
      const spd = rand(200, 520);
      const vx = Math.cos(ang)*spd;
      const vy = Math.sin(ang)*spd - 300;
      const life = 500 + Math.random()*500;
      const t0 = performance.now();
      (function anim(t){
        const dt = (t - t0)/1000;
        const nx = x + ox + vx*dt;
        const ny = y + oy + (vy + G*dt)*dt;
        p.style.transform = `translate(${nx - (x+ox)}px, ${ny - (y+oy)}px)`;
        p.style.opacity = String(clamp(1 - dt*1.5, 0, 1));
        if(t - t0 < life){ requestAnimationFrame(anim); }
        else p.remove();
      })(t0);
    }
  }

  // --- Timer ---
  function formatTime(ms){
    const s = Math.max(0, Math.ceil(ms/1000));
    const m = Math.floor(s/60);
    const sec = String(s%60).padStart(2,'0');
    return `${m}:${sec}`;
  }

  function updateTimer(now){
    if(!state.running){ return; }
    const remain = state.endsAt - now;
    timerEl.textContent = formatTime(remain);
    if(remain <= 0){
      endGame();
    }
  }

  // --- Orientation mobile ---
  function showRotateOverlay(){
    overlayEl.classList.remove('hidden');
    overlayEl.innerHTML = `
      <div class="card">
        <h1>Basculez pour jouer</h1>
        <p>Tournez votre appareil en <strong>paysage</strong> pour démarrer.</p>
      </div>`;
  }

  function handleOrientation(){
    if(!isCoarse) return; // desktop: ne rien faire
    const landscape = window.matchMedia('(orientation: landscape)').matches || innerWidth > innerHeight;
    if(landscape){
      overlayEl.classList.add('hidden');
      // si le jeu n'est pas en cours, on démarre une nouvelle manche
      if(!state.running){ restartGame(); }
    } else {
      // stop/pause
      state.running = false;
      showRotateOverlay();
    }
  }

  // --- Boucle de jeu ---
  function tick(t){
    if(!state.running){ state.lastTime = t; requestAnimationFrame(tick); return; }
    const dt = Math.min((t - state.lastTime) / 1000, 0.033);
    state.lastTime = t;

    // timer
    updateTimer(t);

    // spawn
    if(t >= state.nextSpawnAt){
      spawnOnion();
      state.nextSpawnAt = t + randInt(SPAWN_EVERY_MIN, SPAWN_EVERY_MAX);
    }

    // update entities
    for(let i=state.entities.length-1;i>=0;i--){
      const e = state.entities[i];
      e.vy += G * dt;
      e.x  += e.vx * dt;
      e.y  += e.vy * dt;
      e.rot += e.vrot * dt;
      // appliquer transform anisotrope
      e.el.style.transform = `translate(${e.x}px,${e.y}px) rotate(${e.rot}deg) scale(${e.sx}, ${e.sy})`;
      // supprimer si hors écran
      if(e.y > H + 180 || e.x < -220 || e.x > W + 220){
        removeEntity(e);
      }
    }

    requestAnimationFrame(tick);
  }

  // --- Fin de partie ---
  function endGame(){
    state.running = false;
    timerEl.textContent = '0:00';
    overlayEl.classList.remove('hidden');
    overlayEl.innerHTML = `
      <div class="card">
        <h1>Temps écoulé !</h1>
        <p>Score final : <strong>${state.score}</strong> oignon(s) coupé(s) en 1 min.</p>
        <p>Meilleur combo : <strong>×${state.bestCombo}</strong></p>
        <button id="play-again">Rejouer</button>
      </div>`;
    $('#play-again')?.addEventListener('click', restartGame);
  }

  // --- Gestion taille ---
  function onResize(){ W = innerWidth; H = innerHeight; if(isCoarse) handleOrientation(); }
  window.addEventListener('resize', onResize);
  const mql = window.matchMedia('(orientation: landscape)');
  mql.addEventListener?.('change', handleOrientation);

  // --- Contrôles ---
  startBtn?.addEventListener('click', startGame);
  resetBtn?.addEventListener('click', restartGame);
  window.addEventListener('keydown', (e)=>{
    if(e.key.toLowerCase()==='r') restartGame();
  });

  // Gestes de lame globaux (mobile + desktop)
  let bladeActive = false, bx=0, by=0, bt=0;
  gameEl.addEventListener('pointerdown', (e)=>{
    bladeActive = true; bx = e.clientX; by = e.clientY; bt = performance.now();
    gameEl.setPointerCapture?.(e.pointerId);
    showBladeSegment(bx,by,bx+0.01,by+0.01);
    trySliceAt(bx,by);
  });
  gameEl.addEventListener('pointermove', (e)=>{
    if(!bladeActive) return;
    const x = e.clientX, y = e.clientY, now = performance.now();
    showBladeSegment(bx,by,x,y);
    if((x-bx)*(x-bx) + (y-by)*(y-by) > 12*12 || now-bt>18){
      sweepSlice(bx,by,x,y);
      bx=x; by=y; bt=now;
    }
  }, {passive:true});
  gameEl.addEventListener('pointerup', ()=>{ bladeActive=false; });
  gameEl.addEventListener('pointercancel', ()=>{ bladeActive=false; });

  function startGame(){
    overlayEl.classList.add('hidden');
    // Réinitialiser overlay à l'écran titre si besoin
    if(!$('#start')){
      overlayEl.innerHTML = `
        <div class="card">
          <h1>Fruit Ninja : Oignons</h1>
          <p>Clique / Balaye pour couper. 1 minute chrono !</p>
          <button id="start">Jouer</button>
        </div>`;
      $('#start')?.addEventListener('click', startGame);
    }
    state.running = true; state.score = 0; scoreEl.textContent = '0';
    state.comboMult = 1; state.comboLast = 0; state.bestCombo = 1; comboEl.textContent = '×1';
    timerEl.textContent = '1:00';
    state.lastTime = performance.now();
    state.nextSpawnAt = state.lastTime + 400;
    state.endsAt = state.lastTime + ROUND_MS;
  }

  function restartGame(){
    // Nettoyage des entités & particules
    for(const e of state.entities) e.el.remove();
    state.entities.length = 0;
    $$('.particle', gameEl).forEach(p=>p.remove());
    $$('.slash', gameEl).forEach(s=>s.remove());
    $$('.comboFlash', gameEl).forEach(c=>c.remove());
    state.score = 0; scoreEl.textContent = '0';
    state.comboMult = 1; state.comboLast = 0; state.bestCombo = 1; comboEl.textContent = '×1';
    timerEl.textContent = '1:00';
    state.lastTime = performance.now();
    state.nextSpawnAt = state.lastTime + 400;
    state.endsAt = state.lastTime + ROUND_MS;
    state.running = true;
    overlayEl.classList.add('hidden');
  }

  // Lancer la boucle
  requestAnimationFrame(tick);
  // Au chargement: gestion orientation mobile
  if(isCoarse) handleOrientation();
  </script>
</body>
</html>
