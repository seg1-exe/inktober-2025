<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Beer Simulator 🍺</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at center, #f5deb3, #e0b95d);
    overflow: hidden;
    touch-action: none;
    font-family: system-ui, sans-serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #ui {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  #start {
    pointer-events: all;
    background: #fff8;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
    margin-bottom: 20px;
    cursor: pointer;
  }
  #status {
    color: #fff;
    font-size: 1.1rem;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
    margin-bottom: 40px;
    min-height: 1.2em;
  }
</style>
</head>
<body>

<canvas id="beerCanvas"></canvas>

<div id="ui">
  <button id="start">🍺 Commencer</button>
  <div id="status"></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('beerCanvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('start');
  const statusEl = document.getElementById('status');

  let width, height;
  let beta = 0, gamma = 0;
  let baseBeta = 0, baseGamma = 0;
  let beerLevel = 0.9;
  let empty = false;
  let time = 0;

  const DRAIN_RATE = 0.18; // vitesse de vidage
  const THRESH = -5;       // incline vers soi pour boire
  const MIN_LEVEL = 0.05;  // reste toujours un fond
  const FOAM_HEIGHT = 20;  // hauteur de mousse

  function resize() {
    width = canvas.width = window.innerWidth * window.devicePixelRatio;
    height = canvas.height = window.innerHeight * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }

  window.addEventListener('resize', resize);
  resize();

  function drawBeer() {
    ctx.clearRect(0, 0, width, height);

    const midY = height * beerLevel;
    const tilt = gamma * 0.02; // inclinaison visuelle (roulis)
    const amplitude = 8; // amplitude de vague
    const waveLength = 80; // largeur de vague

    // Couleur bière
    const gradient = ctx.createLinearGradient(0, midY, 0, height);
    gradient.addColorStop(0, '#f5a623');
    gradient.addColorStop(1, '#c67c00');

    ctx.beginPath();
    // Surface de la bière avec vagues inclinées
    for (let x = 0; x <= width; x += 10) {
      const angle = (x / waveLength) + time * 2;
      const y = midY + Math.sin(angle) * amplitude + x * tilt;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    // Mousse blanche
    ctx.beginPath();
    for (let x = 0; x <= width; x += 10) {
      const angle = (x / waveLength) + time * 2.5;
      const y = midY + Math.sin(angle) * (amplitude * 0.6) - FOAM_HEIGHT;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.lineWidth = 12;
    ctx.strokeStyle = '#fff';
    ctx.shadowColor = 'rgba(255,255,255,0.6)';
    ctx.shadowBlur = 6;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function loop(dt) {
    time += 0.016;

    // Vidage si incliné
    if (beta - baseBeta < THRESH && !empty && beerLevel > MIN_LEVEL) {
      beerLevel -= DRAIN_RATE * 0.016;
      statusEl.textContent = '🍺 Glou glou…';
      if (beerLevel <= MIN_LEVEL) {
        beerLevel = MIN_LEVEL;
        empty = true;
        statusEl.textContent = 'Secoue pour remplir ton verre 🍻';
      }
    } else if (!empty) {
      statusEl.textContent = '';
    }

    drawBeer();
    requestAnimationFrame(loop);
  }

  function onShake(e) {
    if (!empty) return;
    const a = e.accelerationIncludingGravity || e.acceleration || {x:0,y:0,z:0};
    const shake = Math.abs(a.x) + Math.abs(a.y) + Math.abs(a.z);
    if (shake > 40) {
      beerLevel = 0.9;
      empty = false;
      statusEl.textContent = '';
    }
  }

  async function start() {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== 'granted') {
          statusEl.textContent = "Permission refusée 😢";
          return;
        }
      } catch {
        statusEl.textContent = "Erreur de permission 😢";
        return;
      }
    }

    startBtn.style.display = 'none';
    statusEl.textContent = '';

    window.addEventListener('deviceorientation', (e) => {
      beta = e.beta || 0;
      gamma = e.gamma || 0;
      if (baseBeta === 0 && baseGamma === 0) {
        baseBeta = beta;
        baseGamma = gamma;
      }
    });

    window.addEventListener('devicemotion', onShake);
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', start);
})();
</script>

</body>
</html>
