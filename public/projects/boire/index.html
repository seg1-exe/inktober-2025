<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Beer Simulator 🍺</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #f5deb3, #e0b95d);
    font-family: system-ui, sans-serif;
  }

  /* Le verre */
  .glass {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    transform-origin: center center;
    will-change: transform;
    z-index: 1; /* important : derrière l’UI */
  }

  /* Le liquide */
  .beer {
    position: relative;
    width: 200vw; /* plus large pour simuler le débordement */
    height: 90%;
    background: linear-gradient(to top, #c67c00, #f5a623);
    transform-origin: center bottom;
    will-change: transform, height;
  }

  .foam {
    position: absolute;
    top: -40px;
    left: 0;
    width: 100%;
    height: 60px;
    background: radial-gradient(circle at 50% 50%, #fff 40%, #f7f3e9 100%);
    opacity: 0.9;
    border-radius: 50%;
    animation: foam 3s infinite ease-in-out;
  }

  @keyframes foam {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  /* UI fixée à l'écran */
  #ui {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    z-index: 10; /* au-dessus du verre */
    pointer-events: none;
  }

  #start, #invert {
    pointer-events: all;
    background: #fff8;
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 1rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
    margin-bottom: 10px;
    cursor: pointer;
  }

  #message, #debug {
    pointer-events: none;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 5px rgba(0,0,0,0.3);
    font-size: 1rem;
    margin-bottom: 10px;
  }

  #debug {
    background: rgba(255,255,255,0.7);
    color: #222;
    font-family: monospace;
    font-size: 0.8rem;
    border-radius: 8px;
    padding: 6px 10px;
  }
</style>
</head>
<body>

<div class="glass" id="glass">
  <div class="beer" id="beer">
    <div class="foam"></div>
  </div>
</div>

<div id="ui">
  <button id="start">🍺 Commencer</button>
  <button id="invert">↕️ Axe normal</button>
  <div id="message">Incline ton téléphone pour boire !</div>
  <div id="debug"></div>
</div>

<script>
const glass = document.getElementById("glass");
const beer = document.getElementById("beer");
const startBtn = document.getElementById("start");
const invertBtn = document.getElementById("invert");
const message = document.getElementById("message");
const debug = document.getElementById("debug");

let beerLevel = 0.9; // plein
let beta = 0;
let gamma = 0;
let invert = false;
let empty = false;
let baseBeta = null; // calibration automatique

async function start() {
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") {
        message.textContent = "Permission refusée 😢";
        return;
      }
    } catch {
      message.textContent = "Erreur de permission 😢";
      return;
    }
  }

  startBtn.style.display = "none";
  message.textContent = "Santé 🍻 Incline pour boire !";

  window.addEventListener("deviceorientation", (e) => {
    beta = e.beta || 0;
    gamma = e.gamma || 0;

    // calibration automatique au lancement
    if (baseBeta === null) baseBeta = beta;
  });

  window.addEventListener("devicemotion", onShake);
  requestAnimationFrame(loop);
}

function loop() {
  // Correction relative à la calibration
  const relBeta = beta - baseBeta;
  const relGamma = gamma;

  // Inclinaison visuelle du verre (gauche/droite)
  glass.style.transform = `rotate(${relGamma * 0.5}deg)`;
  // Le liquide reste horizontal
  beer.style.transform = `rotate(${-relGamma * 0.5}deg)`;

  // Affichage debug
  debug.textContent = `β: ${beta.toFixed(1)}° | γ: ${gamma.toFixed(1)}° | Niveau: ${(beerLevel*100).toFixed(0)}%`;

  // Détection de "boire"
  const threshold = 35;
  const drinking = invert ? relBeta < -threshold : relBeta > threshold;

  if (drinking && !empty) {
    beerLevel -= 0.0025;
    if (beerLevel <= 0) {
      beerLevel = 0;
      empty = true;
      message.textContent = "Verre vide ! Secoue pour le remplir 🍻";
    } else {
      message.textContent = "🍺 Glou glou...";
    }
    beer.style.height = (beerLevel * 100) + "%";
  } else if (!empty) {
    message.textContent = "Incline ton téléphone pour boire !";
  }

  requestAnimationFrame(loop);
}

function onShake(e) {
  if (!empty) return;
  const a = e.accelerationIncludingGravity || e.acceleration || {x:0,y:0,z:0};
  const shake = Math.abs(a.x) + Math.abs(a.y) + Math.abs(a.z);
  if (shake > 40) {
    beerLevel = 0.9;
    beer.style.height = (beerLevel * 100) + "%";
    empty = false;
    message.textContent = "Verre rempli ! 🍺";
  }
}

invertBtn.addEventListener("click", () => {
  invert = !invert;
  invertBtn.textContent = invert ? "↕️ Axe inversé" : "↕️ Axe normal";
});

startBtn.addEventListener("click", start);
</script>

</body>
</html>
