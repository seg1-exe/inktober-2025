<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beer Simulator 🍺</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #f5deb3, #e0b95d);
    font-family: system-ui, sans-serif;
  }

  .glass {
    position: fixed;
    inset: 0;
    transform-origin: center center;
    will-change: transform;
  }

  .beer {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200vw;
    height: 90%;
    background: linear-gradient(to top, #c67c00, #f5a623);
    transform-origin: center center;
  }

  .foam {
    position: absolute;
    top: -40px;
    left: 0;
    width: 100%;
    height: 60px;
    background: radial-gradient(circle at 50% 50%, #fff 40%, #f7f3e9 100%);
    opacity: 0.9;
    border-radius: 50%;
    animation: foam 3s infinite ease-in-out;
  }

  @keyframes foam {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  #start, #invert {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: #fff8;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
    cursor: pointer;
  }

  #start { bottom: 70px; }
  #invert { bottom: 30px; }

  #message {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 5px rgba(0,0,0,0.3);
    font-size: 1rem;
  }

  #debug {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(255,255,255,0.7);
    padding: 8px 10px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<div class="glass">
  <div class="beer">
    <div class="foam"></div>
  </div>
  <button id="start">🍺 Commencer</button>
  <button id="invert">↕️ Inverser axe</button>
  <div id="message">Incline ton téléphone pour boire !</div>
  <div id="debug"></div>
</div>

<script>
const glass = document.querySelector(".glass");
const beer = document.querySelector(".beer");
const startBtn = document.getElementById("start");
const invertBtn = document.getElementById("invert");
const message = document.getElementById("message");
const debug = document.getElementById("debug");

let beerLevel = 0.9;
let beta = 0;
let gamma = 0;
let invert = false;
let empty = false;

async function start() {
  // Permissions iOS
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") {
        message.textContent = "Permission refusée 😢";
        return;
      }
    } catch {
      message.textContent = "Erreur de permission 😢";
      return;
    }
  }

  startBtn.style.display = "none";
  message.textContent = "Santé 🍻 Incline pour boire !";

  window.addEventListener("deviceorientation", (e) => {
    beta = e.beta || 0;
    gamma = e.gamma || 0;
  });

  window.addEventListener("devicemotion", onShake);
  requestAnimationFrame(loop);
}

function loop() {
  // Inclinaison du verre (gauche/droite)
  const tiltZ = gamma * 0.5;
  glass.style.transform = `rotate(${tiltZ}deg)`;
  beer.style.transform = `translateX(-50%) rotate(${-tiltZ}deg)`;

  // Affichage debug
  debug.textContent = `β (pitch): ${beta.toFixed(1)}°\nγ (roll): ${gamma.toFixed(1)}°\nNiveau: ${(beerLevel*100).toFixed(0)}%`;

  // Calcul de l'inclinaison absolue
  let absPitch = Math.abs(beta);
  if (invert) absPitch = -beta; // si on veut inverser la direction du "vers toi"

  // Si penché suffisamment vers soi, on vide
  if ((invert ? absPitch > 40 : absPitch < -40) && !empty) {
    beerLevel -= 0.0025;
    if (beerLevel < 0) beerLevel = 0;
    beer.style.height = beerLevel * 100 + "%";
    message.textContent = "🍺 Glou glou...";
    if (beerLevel === 0) {
      message.textContent = "Verre vide ! Secoue pour le remplir 🍻";
      empty = true;
    }
  } else if (!empty) {
    message.textContent = "Incline ton téléphone pour boire !";
  }

  requestAnimationFrame(loop);
}

function onShake(e) {
  if (!empty) return;
  const a = e.accelerationIncludingGravity || e.acceleration || {x:0,y:0,z:0};
  const shake = Math.abs(a.x) + Math.abs(a.y) + Math.abs(a.z);
  if (shake > 40) {
    beerLevel = 0.9;
    beer.style.height = beerLevel * 100 + "%";
    empty = false;
    message.textContent = "Verre rempli ! 🍺";
  }
}

invertBtn.addEventListener("click", () => {
  invert = !invert;
  invertBtn.textContent = invert ? "↕️ Axe inversé" : "↕️ Axe normal";
});

startBtn.addEventListener("click", start);
</script>

</body>
</html>
