<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Beer Simulator 🍺</title>
<style>
  :root {
    --bg1: #f5deb3;
    --bg2: #e0b95d;
    --amber1: #f5a623;
    --amber2: #c67c00;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(circle at center, var(--bg1), var(--bg2));
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden;
  }

  .glass {
    position: fixed;
    inset: 0;
    transform-origin: 50% 50%;
    will-change: transform;
  }

  .beer {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 220vw;
    height: 90vh;
    background: linear-gradient(to top, var(--amber2), var(--amber1));
    transform-origin: 50% 100%;
  }

  .foam {
    position: absolute;
    top: -34px;
    left: 0;
    width: 100%;
    height: 52px;
    background: radial-gradient(circle at 50% 55%, #fff 42%, #f7f3e9 100%);
    border-radius: 50%/60%;
    opacity: 0.95;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.1));
    animation: foam-bob 3s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes foam-bob {
    50% {
      transform: translateY(2px);
    }
  }

  #ui {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    z-index: 10;
    pointer-events: none;
  }

  #start {
    pointer-events: all;
    background: #fff8;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
    margin-bottom: 20px;
    cursor: pointer;
  }

  #status {
    color: #fff;
    font-size: 1.1rem;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
    margin-bottom: 40px;
  }
</style>
</head>
<body>

<div class="glass" id="glass">
  <div class="beer" id="beer">
    <div class="foam"></div>
  </div>
</div>

<div id="ui">
  <button id="start">🍺 Commencer</button>
  <div id="status">Secoue pour remplir ton verre</div>
</div>

<script>
(() => {
  const glass = document.getElementById('glass');
  const beer  = document.getElementById('beer');
  const startBtn = document.getElementById('start');
  const statusEl = document.getElementById('status');

  let beta = 0, gamma = 0;
  let baseBeta = 0, baseGamma = 0;
  let betaRel = 0, gammaRel = 0;
  let level = 1.0;
  let empty = false;
  let lastT = null;

  const DRAIN_PER_SEC = 0.22;
  const MAX_LIQ_VH = 90;
  const MAX_TILT_VISUAL = 20;
  const THRESH = -5; // seuil d’inclinaison pour "boire"

  // Calculs utilitaires
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mapLevelToVH = (level) => clamp(level, 0, 1) * MAX_LIQ_VH;

  // Appliquer la rotation visuelle
  function applyVisual() {
    const zTilt = clamp(gammaRel, -MAX_TILT_VISUAL, MAX_TILT_VISUAL);
    glass.style.transform = `rotate(${zTilt}deg)`;
    beer.style.transform = `translateX(-50%) rotate(${-zTilt}deg)`;
    beer.style.height = mapLevelToVH(level) + 'vh';
  }

  // Vidage du verre quand on incline
  function drinkLogic(dt) {
    if (betaRel < THRESH && !empty && level > 0) {
      level -= DRAIN_PER_SEC * dt;
      if (level <= 0) {
        level = 0;
        empty = true;
        statusEl.textContent = 'Verre vide ! Secoue pour remplir 🍻';
      } else {
        statusEl.textContent = '🍺 Glou glou…';
      }
    } else if (!empty) {
      statusEl.textContent = 'Incline ton téléphone pour boire 🍺';
    }
  }

  // Détection de secousse pour re-remplir
  function onShake(e) {
    if (!empty) return;
    const a = e.accelerationIncludingGravity || e.acceleration || {x:0,y:0,z:0};
    const shake = Math.abs(a.x) + Math.abs(a.y) + Math.abs(a.z);
    if (shake > 40) {
      level = 1.0;
      empty = false;
      statusEl.textContent = 'Verre rempli ! 🍺';
    }
  }

  // Demande d’autorisation + capteurs
  async function start() {
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") {
          statusEl.textContent = "Permission refusée 😢";
          return;
        }
      } catch {
        statusEl.textContent = "Erreur de permission 😢";
        return;
      }
    }

    startBtn.style.display = "none";
    statusEl.textContent = "Incline ton téléphone pour boire 🍻";

    window.addEventListener("deviceorientation", (e) => {
      beta = e.beta || 0;
      gamma = e.gamma || 0;
      if (baseBeta === 0 && baseGamma === 0) {
        baseBeta = beta;
        baseGamma = gamma;
      }
    });

    window.addEventListener("devicemotion", onShake);
    requestAnimationFrame(loop);
  }

  function loop(ts) {
    if (!lastT) lastT = ts;
    const dt = Math.min((ts - lastT) / 1000, 0.1);
    lastT = ts;

    betaRel = beta - baseBeta;
    gammaRel = gamma - baseGamma;

    drinkLogic(dt);
    applyVisual();

    requestAnimationFrame(loop);
  }

  startBtn.addEventListener("click", start);
})();
</script>

</body>
</html>
