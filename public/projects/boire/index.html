<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Beer Simulator 🍺</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #f5deb3, #e0b95d);
    font-family: system-ui, sans-serif;
  }

  .glass {
    position: fixed;
    inset: 0;
    transform-origin: center center;
    will-change: transform;
  }

  .beer {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200vw;
    height: 90%;
    background: linear-gradient(to top, #c67c00, #f5a623);
    transform-origin: center center;
    will-change: transform, height;
  }

  .foam {
    position: absolute;
    top: -40px;
    left: 0;
    width: 100%;
    height: 60px;
    background: radial-gradient(circle at 50% 50%, #fff 40%, #f7f3e9 100%);
    opacity: 0.9;
    border-radius: 50%;
    animation: foam 3s infinite ease-in-out;
  }

  @keyframes foam {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  #start {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff8;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
    cursor: pointer;
  }

  #message {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 5px rgba(0,0,0,0.3);
    font-size: 1rem;
  }
</style>
</head>
<body>

<div class="glass">
  <div class="beer">
    <div class="foam"></div>
  </div>
  <button id="start">🍺 Commencer</button>
  <div id="message">Incline ton téléphone pour boire !</div>
</div>

<script>
const glass = document.querySelector(".glass");
const beer = document.querySelector(".beer");
const startBtn = document.getElementById("start");
const message = document.getElementById("message");

let beerLevel = 0.9; // 90% plein au départ
let beta = 0;
let gamma = 0;
let baseline = { beta: 0, gamma: 0 };
let permissionGranted = false;
let empty = false;

// ⚙️ Démarrage : demande de permission et init des listeners
async function start() {
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") {
        message.textContent = "Permission refusée 😢";
        return;
      }
      permissionGranted = true;
    } catch {
      message.textContent = "Erreur de permission 😢";
      return;
    }
  } else {
    permissionGranted = true; // Android souvent n’en a pas besoin
  }

  startBtn.style.display = "none";
  message.textContent = "Santé 🍻 Incline pour boire !";

  // Capturer la position de référence (téléphone droit)
  window.addEventListener("deviceorientation", (e) => {
    if (baseline.beta === 0 && baseline.gamma === 0) {
      baseline.beta = e.beta || 0;
      baseline.gamma = e.gamma || 0;
    }
    beta = (e.beta || 0) - baseline.beta;
    gamma = (e.gamma || 0) - baseline.gamma;
  });

  window.addEventListener("devicemotion", onShake);

  requestAnimationFrame(loop);
}

// 🍺 Animation principale
function loop() {
  // Inclinaison visuelle du verre
  const tiltX = gamma; // gauche/droite
  const tiltY = beta;  // avant/arrière
  glass.style.transform = `rotateY(${-tiltX * 0.5}deg) rotateX(${tiltY * 0.5}deg)`;

  // Le liquide reste horizontal
  beer.style.transform = `translateX(-50%) rotateY(${tiltX * 0.5}deg) rotateX(${-tiltY * 0.5}deg)`;

  // Si incliné vers soi (verre "penché" pour boire)
  if (tiltY > 40 && !empty) {
    beerLevel -= 0.002; // vitesse de vidage
    if (beerLevel < 0) beerLevel = 0;
    beer.style.height = beerLevel * 100 + "%";
    message.textContent = "🍺 Glou glou...";
    if (beerLevel === 0) {
      message.textContent = "Verre vide ! Secoue pour le remplir 🍻";
      empty = true;
    }
  } else if (!empty) {
    message.textContent = "Incline ton téléphone pour boire !";
  }

  requestAnimationFrame(loop);
}

// 🍻 Secouer pour remplir
function onShake(e) {
  if (!empty) return;
  const accel = Math.abs(e.acceleration.x) + Math.abs(e.acceleration.y) + Math.abs(e.acceleration.z);
  if (accel > 40) {
    beerLevel = 0.9;
    beer.style.height = beerLevel * 100 + "%";
    empty = false;
    message.textContent = "Verre rempli ! 🍺";
  }
}

startBtn.addEventListener("click", start);
</script>

</body>
</html>
