<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beer Simulator 🍺</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(circle at center, #f5deb3, #e0b95d);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  .glass {
    position: relative;
    width: 250px;
    height: 500px;
    border-radius: 20px;
    border: 4px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 30px rgba(0,0,0,0.2);
    overflow: hidden;
    backdrop-filter: blur(6px);
  }

  .beer {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 90%;
    background: linear-gradient(#f5a623, #c67c00);
    transform-origin: bottom center;
    transition: transform 0.1s linear;
  }

  .foam {
    position: absolute;
    top: -25px;
    width: 100%;
    height: 35px;
    background: radial-gradient(circle at 50% 50%, #fff 40%, #f7f3e9 100%);
    border-radius: 50%;
    animation: foamMove 3s infinite ease-in-out;
    opacity: 0.9;
  }

  @keyframes foamMove {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  #start {
    position: absolute;
    bottom: 40px;
    background: #fff8;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
    cursor: pointer;
    transition: background 0.2s;
  }

  #start:hover {
    background: #fff;
  }

  #message {
    position: absolute;
    bottom: 10px;
    text-align: center;
    width: 100%;
    color: #fff;
    font-size: 0.9rem;
    text-shadow: 0 0 5px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<div class="glass">
  <div class="beer">
    <div class="foam"></div>
  </div>
  <button id="start">🍺 Commencer</button>
  <div id="message">Incline ton téléphone pour boire !</div>
</div>

<script>
  const beer = document.querySelector(".beer");
  const startBtn = document.getElementById("start");
  const message = document.getElementById("message");
  let beerHeight = 90;
  let drinking = false;

  async function startMotion() {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== 'granted') {
        message.textContent = "Permission refusée 😢";
        return;
      }
    }

    startBtn.style.display = 'none';
    message.textContent = "Santé ! 🍻";

    window.addEventListener("deviceorientation", handleTilt);
  }

  function handleTilt(event) {
    const beta = event.beta || 0;   // avant/arrière
    const gamma = event.gamma || 0; // gauche/droite

    // rotation visuelle
    beer.style.transform = `rotate(${gamma * -0.5}deg) scaleY(${beerHeight / 90})`;

    // si on incline fortement => boire
    if (Math.abs(beta) > 60 && beerHeight > 0) {
      beerHeight -= 0.3;
      beer.style.height = beerHeight + "%";
    } else if (Math.abs(beta) < 10 && beerHeight <= 0) {
      message.textContent = "🍻 C'était bon ! Secoue pour remplir à nouveau.";
    }
  }

  // Re-remplir si on secoue
  window.addEventListener("devicemotion", (e) => {
    const accel = Math.abs(e.acceleration.x) + Math.abs(e.acceleration.y) + Math.abs(e.acceleration.z);
    if (accel > 40 && beerHeight < 90) {
      beerHeight = 90;
      beer.style.height = beerHeight + "%";
      message.textContent = "Verre rempli ! 🍺";
    }
  });

  startBtn.addEventListener("click", startMotion);
</script>

</body>
</html>
