<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beer Simulator 🍺</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #f5deb3, #e0b95d);
    font-family: system-ui, sans-serif;
  }

  .glass {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    transform-origin: center center;
  }

  .beer {
    position: absolute;
    bottom: 0;
    width: 200vw; /* plus large que l’écran pour simuler le dévers */
    left: -50vw;
    height: 90%;
    background: linear-gradient(to top, #c67c00, #f5a623);
    transform-origin: center center;
    transition: height 0.1s linear;
  }

  .foam {
    position: absolute;
    top: -40px;
    left: 0;
    width: 100%;
    height: 60px;
    background: radial-gradient(circle at 50% 50%, #fff 40%, #f7f3e9 100%);
    opacity: 0.9;
    border-radius: 50%;
    animation: foam 3s infinite ease-in-out;
  }

  @keyframes foam {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  #start {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff8;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
    cursor: pointer;
  }

  #message {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 5px rgba(0,0,0,0.3);
    font-size: 1rem;
  }
</style>
</head>
<body>

<div class="glass">
  <div class="beer">
    <div class="foam"></div>
  </div>
  <button id="start">🍺 Commencer</button>
  <div id="message">Incline ton téléphone pour boire !</div>
</div>

<script>
  const glass = document.querySelector(".glass");
  const beer = document.querySelector(".beer");
  const startBtn = document.getElementById("start");
  const message = document.getElementById("message");

  let beerHeight = 90;
  let beta = 0;
  let gamma = 0;
  let drinking = false;

  async function startMotion() {
    // Permissions sur iOS
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== 'granted') {
        message.textContent = "Permission refusée 😢";
        return;
      }
    }

    startBtn.style.display = 'none';
    message.textContent = "Santé ! 🍻";

    window.addEventListener("deviceorientation", (e) => {
      beta = e.beta || 0;
      gamma = e.gamma || 0;
    });

    window.addEventListener("devicemotion", handleShake);

    animate();
  }

  function animate() {
    // inclinaison du verre (effet 3D)
    glass.style.transform = `rotateX(${beta * 0.25}deg) rotateY(${gamma * 0.3}deg)`;

    // le liquide reste horizontal
    beer.style.transform = `rotate(${-gamma * 0.5}deg)`;

    // seuil d'inclinaison (plus de 40° => boire)
    const angle = Math.abs(beta);
    const drinkingNow = angle > 40;

    if (drinkingNow && beerHeight > 0) {
      beerHeight -= 0.25; // vitesse du vidage
      if (beerHeight < 0) beerHeight = 0;
      beer.style.height = beerHeight + "%";
      message.textContent = "🍺 Glou glou...";
    } else if (beerHeight <= 0) {
      message.textContent = "Verre vide ! Secoue pour remplir à nouveau 🍻";
    } else if (!drinkingNow) {
      message.textContent = "Incline ton téléphone pour boire !";
    }

    requestAnimationFrame(animate);
  }

  function handleShake(e) {
    const accel = Math.abs(e.acceleration.x) + Math.abs(e.acceleration.y) + Math.abs(e.acceleration.z);
    if (accel > 40 && beerHeight < 90) {
      beerHeight = 90;
      beer.style.height = beerHeight + "%";
      message.textContent = "Verre rempli ! 🍺";
    }
  }

  startBtn.addEventListener("click", startMotion);
</script>

</body>
</html>
