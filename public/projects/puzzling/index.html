<script>
(() => {
  /* ---------- utils ---------- */
  const qs = (s,el=document)=>el.querySelector(s);
  const qsa = (s,el=document)=>[...el.querySelectorAll(s)];
  const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const rand=(a=0,b=1)=>a+Math.random()*(b-a);
  const choice = a=>a[(Math.random()*a.length)|0];

  /* ---------- elements ---------- */
  const oracle=qs('#oracle'), consoleEl=qs('#console');
  const cursorRoot=qs('#cursor-root'), soundToggle=qs('#sound-toggle'), hint=qs('#hint');
  const barsRoot=qs('#glitch-bars'), toasts=qs('#toasts') || (()=>{const d=document.createElement('div');d.id='toasts';d.className='toasts';document.body.appendChild(d);return d;})();
  const floodRoot=qs('#flood-root'), textPopRoot=qs('#text-pop-root'), imagePopRoot=qs('#image-pop-root'), hugeTextRoot=qs('#huge-text-root');
  const userTrackEl=qs('#user-track');

  /* ---------- environment ---------- */
  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- user images ---------- */
  // Replace with your images (ideally optimized, <=300KB each)
  const IMAGE_URLS = [
    "./images/image1.jpg","./images/image2.jpg","./images/image3.jpg","./images/image4.jpg","./images/image5.jpg",
    "./images/image6.jpg","./images/image7.jpg","./images/image8.jpg","./images/image9.jpg","./images/image10.jpg"
  ];

  /* ---------- possessed cursor (disabled on touch) ---------- */
  if (!isCoarse && !reduceMotion) {
    const ghosts=[], N_GHOSTS=6, trail=Array.from({length:24},()=>({x:innerWidth/2,y:innerHeight/2}));
    const dot=document.createElement('div'); dot.className='cursor-dot'; cursorRoot.appendChild(dot);
    document.body.classList.add('hide-native-cursor');
    for(let i=0;i<N_GHOSTS;i++){ const g=document.createElement('div'); g.className='cursor-ghost'; g.style.opacity=String(0.18+i*0.05); cursorRoot.appendChild(g); ghosts.push(g); }
    const mouse={x:innerWidth/2,y:innerHeight/2}, spirit={x:innerWidth/2,y:innerHeight/2};
    addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;},{passive:true});
    addEventListener('touchmove',e=>{const t=e.touches[0]; if(t){mouse.x=t.clientX;mouse.y=t.clientY;}},{passive:true});
    let t0=performance.now();
    function cursorLoop(now){
      const dt=Math.min(32,now-t0); t0=now;
      const lag=0.22, jitter=1.3;
      spirit.x=lerp(spirit.x, mouse.x+Math.sin(now*0.018)*jitter, 1-Math.pow(1-lag, dt/16));
      spirit.y=lerp(spirit.y, mouse.y+Math.cos(now*0.011)*jitter, 1-Math.pow(1-lag, dt/16));
      trail.pop(); trail.unshift({x:spirit.x,y:spirit.y});
      dot.style.transform=`translate(${spirit.x}px, ${spirit.y}px)`;
      for(let i=0;i<ghosts.length;i++){const idx=clamp((i+1)*4,0,trail.length-1); const p=trail[idx]; const trem=(Math.sin(now*0.02+i)*1.2); ghosts[i].style.transform=`translate(${p.x+trem}px, ${p.y-trem}px)`;}
      requestAnimationFrame(cursorLoop);
    }
    requestAnimationFrame(cursorLoop);
    // On resize keep centered
    addEventListener('resize',()=>{ for(let i=0;i<trail.length;i++) trail[i]={x:innerWidth/2,y:innerHeight/2}; }, {passive:true});
  } else {
    // Touch/coarse: no custom cursor layer
    cursorRoot.style.display = 'none';
  }

  /* ---------- dynamic text ---------- */
  const lines=[
    'Welcome.', 'Do not stay.', 'You are being watched.', 'The pattern watches back.',
    'Connection unstable.', 'Signal to noise: rising.', 'I speak in artifacts.',
    'Is this the right layer?', 'Do you remember your first tap?', 'Your pointer breathes.',
    'Puzzles solve people.', 'This page edits you.'
  ];
  function scrambleTo(text,duration=reduceMotion?0:900){
    if (duration===0){ oracle.textContent=text; return; }
    const charset='!<>-_\\/[]{}—=+*^?#________';
    const from=oracle.textContent||''; const len=Math.max(from.length,text.length); const queue=[];
    for(let i=0;i<len;i++){const fromCh=from[i]||''; const toCh=text[i]||''; const start=(Math.random()*duration*0.4)|0; const end=start+((Math.random()*duration*0.6)|0); queue.push({fromCh,toCh,start,end});}
    const tStart=performance.now();
    (function tick(now){
      const t=now-tStart; let out='';
      queue.forEach(q=>{ if(t<q.start) out+=q.fromCh; else if(t>q.end) out+=q.toCh; else out+=choice(charset); });
      oracle.textContent=out;
      if(t<duration) requestAnimationFrame(tick); else oracle.textContent=text;
    })(tStart);
  }
  setInterval(()=>{
    const next=choice(lines);
    scrambleTo(next);
  }, 2400+Math.random()*1000);

  /* ---------- visual glitches (bars + filters) ---------- */

  for(let i=0;i<BAR_POOL;i++){const bar=document.createElement('div'); bar.className='glitch-bar'; barsRoot.appendChild(bar);}

    qsa('.glitch-bar',barsRoot).forEach(bar=>{
      const y=Math.random()*100, h=rand(6, isCoarse?14:18), d=rand(0.8, 2.0);
      bar.style.top=`calc(${y}vh - ${h/2}px)`; bar.style.height=`${h}px`;
      bar.style.transition=`transform ${d}s cubic-bezier(.2,.8,0,1), opacity .3s ease`;
      bar.style.opacity=String(rand(0.06,0.35)); bar.style.transform='translateX(0)';
      setTimeout(()=>{ bar.style.transform='translateX(-14vw)'; bar.style.opacity='0'; }, (d*1000)|0);
    });
  }
  if (!reduceMotion) setInterval(()=>{ if(Math.random()<0.7) animateBars(); }, isCoarse?1800:1500);

  // body filter pulses remain monochrome
  const fxClasses=['fx-a','fx-b','fx-c'];
  if (!reduceMotion) {
    const styleMono=document.createElement('style'); styleMono.textContent=`
      body.fx-a{ filter: grayscale(1) contrast(1.08) }
      body.fx-b{ filter: grayscale(1) brightness(1.05) }
      body.fx-c{ filter: grayscale(1) contrast(1.02) }
    `; document.head.appendChild(styleMono);
    setInterval(()=>{ const c=choice(fxClasses); document.body.classList.add(c); setTimeout(()=>document.body.classList.remove(c), 400+Math.random()*700); }, isCoarse?2100:1900);
  }

  /* ---------- sound (Web Audio + optional MP3) ---------- */
  let ctx=null, gainMain, ambientGain, clickGain; let audioReady=false;
  const hasUserTrack = !!(userTrackEl && userTrackEl.getAttribute('src') && userTrackEl.getAttribute('src').trim());
  function initAudio(){
    if(audioReady) return;
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const master=ctx.createGain(); master.gain.value=.9; master.connect(ctx.destination);
    gainMain=ctx.createGain(); gainMain.gain.value=.6; gainMain.connect(master);
    ambientGain=ctx.createGain(); ambientGain.gain.value=.08; ambientGain.connect(gainMain);
    clickGain=ctx.createGain(); clickGain.gain.value=0.0; clickGain.connect(gainMain);
    if(!hasUserTrack){
      if (!reduceMotion) {
        const seconds=2, buf=ctx.createBuffer(1, ctx.sampleRate*seconds, ctx.sampleRate), data=buf.getChannelData(0);
        for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*0.8;
        const noise=ctx.createBufferSource(); noise.buffer=buf; noise.loop=true;
        const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=480; bp.Q.value=.6;
        const lfo=ctx.createOscillator(); lfo.frequency.value=.08; const lfoGain=ctx.createGain(); lfoGain.gain.value=220; lfo.connect(lfoGain); lfoGain.connect(bp.frequency);

        const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=97;
        const o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.value=149;
        const pair=ctx.createGain(); pair.gain.value=0.015; o1.connect(pair); o2.connect(pair); pair.connect(ambientGain); o1.start(); o2.start();

  }
  function resumeAudio(){ if(!audioReady) initAudio(); if(ctx && ctx.state==='suspended') ctx.resume(); if(hasUserTrack) userTrackEl.play().catch(()=>{}); }
  function toggleSound(){
    if(!audioReady) resumeAudio();
    const running = ctx && ctx.state==='running';
    if(running){ ctx.suspend(); if(hasUserTrack) userTrackEl.pause(); soundToggle.setAttribute('aria-pressed','false'); soundToggle.textContent='SOUND: OFF'; }
    else { if(ctx) ctx.resume(); if(hasUserTrack) userTrackEl.play().catch(()=>{}); soundToggle.setAttribute('aria-pressed','true'); soundToggle.textContent='SOUND: ON'; }
  }

  addEventListener('pointerdown', resumeAudio, {passive:true});

  function blip(){

    lvl.textContent=level.padEnd(5,' ');
    msg.textContent=' — '+text;
    row.append(t,lvl,msg); consoleEl.appendChild(row); consoleEl.scrollTop=consoleEl.scrollHeight;
  }
  function toast(text){
    const el=document.createElement('div'); el.className='toast'; el.textContent=text; toasts.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('show')); setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 400); }, 2600+Math.random()*1200);
  }
  setInterval(()=>{ const m=choice(consoleMsgs); const lvl=choice(['info','warn','hint','note']); logLine(lvl,m); if(Math.random()<0.35) toast(m.replace(/: /,' :: ')); }, isCoarse?2800:2400);

  /* ---------- text flood (edges) ---------- */
  const floodPhrases=[
    'do not stay','you are being watched','handshake: unstable','memory: fragmented',
    'puzzles solve people','the pattern watches back','signal to noise: rising','trace route → your gaze'
  ];
  function makeFloodBand(region,lifetime=4000){
    const band=document.createElement('div'); band.className=`flood-band ${region}`; floodRoot.appendChild(band);
    const lines=(isCoarse?3:4)+((region==='left'||region==='right')?(isCoarse?5:8):2);
    for(let i=0;i<lines;i++){
      const l=document.createElement('div'); l.className='flood-line';
      const phrase=choice(floodPhrases).toUpperCase();
      const repeat=(region==='top'||region==='bottom')?16:10; l.textContent=(' '+phrase+' ').repeat(repeat);
      const dur=rand(6,11), delay=rand(-2,2);
      if(region==='top'||region==='bottom'){ l.style.top=`${i * (isCoarse?16:18)}px`; l.style.animation=`floodSlideX ${dur}s linear infinite`; }
      else { l.style.left=`${(i%4) * 18}px`; l.style.writingMode='vertical-rl'; l.style.animation=`floodSlideY ${dur}s linear infinite`; }
      l.style.animationDelay=`${delay}s`; l.style.letterSpacing=`${rand(0,0.2).toFixed(2)}em`; if(Math.random()<0.35) l.style.transform='skewX(1deg)';
      band.appendChild(l);
    }
    setTimeout(()=>band.classList.add('fade'), lifetime-600); setTimeout(()=>band.remove(), lifetime);
  }
  function randomFlood(){ const regions=['top','bottom','left','right']; makeFloodBand(choice(regions), 4200+Math.random()*2200); }

  /* ---------- text pops (center) ---------- */
  function spawnTextPop(){
    const el=document.createElement('div'); el.className='text-pop';
    const x=rand(10,90), y=rand(12,88); el.style.setProperty('--x',x+'vw'); el.style.setProperty('--y',y+'vh'); el.style.setProperty('--rot',(rand(-3,3).toFixed(2)+'deg'));
    const phrase=choice(floodPhrases).toUpperCase(); const wrap=document.createElement('div'); wrap.className='wrap'; wrap.textContent=phrase;
    el.appendChild(wrap); textPopRoot.appendChild(el); requestAnimationFrame(()=>el.classList.add('show'));
    const life=1500+Math.random()*1300; setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),350); }, life);
  }

  /* ---------- HUGE TEXT eruptions ---------- */
  const hugeWords = ['HALT','TRACE','EMPTY','NOISE','ERROR','BLACKOUT','SILENCE','VOID','STATIC','GHOST'];
  function spawnHugeText(){
    const el=document.createElement('div'); el.className='huge-text';
    const x=rand(25,75), y=rand(25,75); el.style.setProperty('--x',x+'vw'); el.style.setProperty('--y',y+'vh');
    el.style.fontSize = `clamp(2.5rem, ${rand(isCoarse?12:10, isCoarse?26:22).toFixed(1)}vw, 30rem)`;
    el.textContent = choice(hugeWords);
    hugeTextRoot.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('show'));
    const life=1200+Math.random()*1600; setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),350); }, life);
  }

  /* ---------- image pops (2–3s) ---------- */
  function spawnImagePop(){
    if(!IMAGE_URLS || ! IMAGE_URLS.length) return;
    const src=choice(IMAGE_URLS), img=new Image();
    const x=rand(8,92), y=rand(8,92), size=rand(isCoarse?18:14, isCoarse?32:28);
    img.className='img-pop'; img.style.setProperty('--x',x+'vw'); img.style.setProperty('--y',y+'vh'); img.style.setProperty('--rot',(rand(-6,6).toFixed(2)+'deg'));
    img.style.width=size+'vmin'; img.style.height='auto';
    const front = Math.random() < 0.45; img.style.zIndex = front ? '1100' : '900';
    img.onload=()=>{ imagePopRoot.appendChild(img); requestAnimationFrame(()=>img.classList.add('show')); const life=2000+Math.random()*1000; setTimeout(()=>{ img.classList.remove('show'); setTimeout(()=>img.remove(),350); }, life); };
    img.src=src;
  }

  /* ---------- schedulers ---------- */
  const floodInterval = isCoarse ? 3000 : 2800;
  setInterval(()=>{
    if(Math.random()<0.85){ const bursts=1+Math.floor(Math.random()*3); for(let i=0;i<bursts;i++){ randomFlood(); } }
    const pops=1+Math.floor(Math.random()*2); for(let i=0;i<pops;i++) if(Math.random()<0.9) spawnTextPop();
  }, floodInterval);

  setInterval(()=>{ if(Math.random()<0.6) spawnHugeText(); }, isCoarse?5600:5200);
  setInterval(()=>{ if(Math.random()<0.6) spawnImagePop(); }, isCoarse?4000:3800);

  /* ---------- small secret ---------- */
  let lastClicks=[]; qs('#stage').addEventListener('click',()=>{
    const now=performance.now(); lastClicks=lastClicks.filter(t=>now-t<650); lastClicks.push(now);
    if(lastClicks.length>=3){ document.body.classList.add('fx-b'); setTimeout(()=>document.body.classList.remove('fx-b'),1600); lastClicks=[]; }
  }, {passive:true});
})();
</script>
</body>
</html>
