<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inktober 2025 · Blast (Vanilla)</title>
  <style>
    :root { --panel-bg: rgba(0,0,0,0.45); --panel-fg: #fff; --border: rgba(255,255,255,0.25); --shadow: 0 10px 30px rgba(0,0,0,0.35); }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: #03060C;
      color: #eee;
      touch-action: manipulation;
    }
    #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #panel {
      position: fixed;
      bottom: 16px;
      left: 16px;
      max-width: 360px;
      width: calc(100vw - 32px);
      padding: 14px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      z-index: 10;
      background: var(--panel-bg);
      color: var(--panel-fg);
      border: 1px solid var(--border);
    }
    #panel h2 { margin: 0; font-size: 16px; font-weight: 600; }
    #panel .row {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px;
    }
    #panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      user-select: none;
    }
    #panel .controls { margin-top: 10px; display: grid; gap: 10px; font-size: 13px; }
    #panel input[type="range"] { width: 100%; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .btn {
      border: 1px solid rgba(255,255,255,0.35);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      background: transparent;
      color: inherit;
    }
    .btn:hover { transform: translateY(-1px); }
    .muted { opacity: 0.8; font-size: 12px; }
    kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      border: 1px solid currentColor;
      border-radius: 6px;
      padding: 1px 4px;
      font-size: 11px;
      opacity: 0.8;
    }
    #panel.collapsed .row,
    #panel.collapsed .controls {
      display: none;
    }
    @media (max-width: 640px) {
      #panel {
        left: 12px;
        right: 12px;
        width: auto;
        bottom: 12px;
      }
      #panel .row {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="panel" class="">
    <div class="topbar">
      <h2>Inktober - Day 21</h2>
      <button
        id="togglePanel"
        class="btn"
        title="Show/hide controls (S)"
      >
        Hide
      </button>
    </div>
    <div class="row" id="types">
      <label><input class="type-toggle" type="checkbox" value="bomb" checked> <span>bomb</span></label>
      <label><input class="type-toggle" type="checkbox" value="firework" checked> <span>firework</span></label>
      <label><input class="type-toggle" type="checkbox" value="pixel"> <span>pixel</span></label>
      <label><input class="type-toggle" type="checkbox" value="electric"> <span>electric</span></label>
    </div>
    <div class="controls">
      <div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span>Frequency</span>
          <span class="tabular-nums" id="freqLabel">1100 ms</span>
        </div>
        <input id="freq" type="range" min="300" max="2500" step="50" value="1100" />
      </div>
      <div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span>Intensity</span>
          <span class="tabular-nums" id="intLabel">1.00×</span>
        </div>
        <input id="intensity" type="range" min="0.5" max="2" step="0.01" value="1" />
      </div>
      <div class="muted">
        Tips:
        <kbd>S</kbd> Panel ·
        <kbd>Space</kbd> Random blast ·
        <kbd>F</kbd> Firework
      </div>
    </div>
  </div>
  <script>
    (function () {
      const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
      const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

      const PALETTES = {
        bomb: ["#ffb703","#fb8500","#e63946","#9d0208","#fde68a","#392f2f"],
        firework: ["#f72585","#b5179e","#3a0ca3","#4361ee","#4cc9f0","#ffd166","#06d6a0"],
        pixel: ["#ff006e","#fb5607","#ffbe0b","#3a86ff","#8338ec"],
        electric: ["#b3e5fc","#81d4fa","#4fc3f7","#29b6f6","#03a9f4"]
      };

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const particles = [];
      const rockets = [];
      let raf = null;
      let nextSpawnAt = 0;

      const settings = {
        types: { bomb: true, firework: true, pixel: false, electric: false },
        baseIntervalMs: 1100,
        intensity: 1.0
      };

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener("resize", resize);
      resize();

      const panel = document.getElementById("panel");
      const togglePanelBtn = document.getElementById("togglePanel");
      let panelOpen = true;

      function updatePanelUI() {
        togglePanelBtn.textContent = panelOpen ? "Hide" : "Controls";
        if (!panelOpen) {
          panel.classList.add("collapsed");
        } else {
          panel.classList.remove("collapsed");
        }
      }

      function togglePanel() {
        panelOpen = !panelOpen;
        updatePanelUI();
      }

      togglePanelBtn.addEventListener("click", togglePanel);

      document.querySelectorAll(".type-toggle").forEach((el) => {
        el.addEventListener("change", () => {
          settings.types[el.value] = el.checked;
        });
      });

      const freq = document.getElementById("freq");
      const freqLabel = document.getElementById("freqLabel");
      freq.addEventListener("input", () => {
        settings.baseIntervalMs = Number(freq.value);
        freqLabel.textContent = Math.round(settings.baseIntervalMs) + " ms";
      });

      const intensity = document.getElementById("intensity");
      const intLabel = document.getElementById("intLabel");
      intensity.addEventListener("input", () => {
        settings.intensity = Number(intensity.value);
        intLabel.textContent = settings.intensity.toFixed(2) + "×";
      });

      function onPointer(e) {
        let x = 0,
          y = 0;
        if (e.touches && e.touches[0]) {
          x = e.touches[0].clientX;
          y = e.touches[0].clientY;
        } else {
          x = e.clientX;
          y = e.clientY;
        }
        triggerExplosion(x, y);
      }

      canvas.addEventListener("click", onPointer);
      canvas.addEventListener("touchstart", onPointer, { passive: true });

      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (k === " ") {
          triggerExplosion(Math.random() * innerWidth, Math.random() * innerHeight);
        } else if (k === "s") {
          togglePanel();
        } else if (k === "f") {
          settings.types.firework = !settings.types.firework;
        }
      });

      function spawnRocket(x, y, vy) {
        rockets.push({
          x,
          y,
          vx: rand(-30, 30),
          vy,
          trailCooldown: 0,
          color: pick(PALETTES.firework),
          targetY: rand(innerHeight * 0.2, innerHeight * 0.45)
        });
      }

      function triggerExplosion(x, y, forcedType) {
        const enabled = Object.keys(settings.types).filter((k) => settings.types[k]);
        const type = forcedType || (enabled.length ? pick(enabled) : "firework");
        const intensity = settings.intensity;
        const push = (p) => particles.push(p);

        switch (type) {
          case "bomb": {
            const N = Math.floor(120 * intensity);
            const pal = PALETTES.bomb;
            push({
              x,
              y,
              vx: 0,
              vy: 0,
              life: 1,
              decay: 0.02,
              size: 30 + rand(10, 40) * intensity,
              color: "#ffffff",
              shape: "ring",
              opacity: 0.8
            });
            for (let i = 0; i < N; i++) {
              const a = rand(0, Math.PI * 2);
              const sp = rand(120, 420) * (0.5 + 0.5 * intensity);
              push({
                x,
                y,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp,
                life: 1,
                decay: rand(0.012, 0.02),
                size: rand(1.5, 3.8),
                color: pick(pal),
                shape: pick(["circle", "square"]),
                gravity: 0.6,
                drag: 0.986,
                opacity: 1,
                blend: "lighter"
              });
            }
            for (let i = 0; i < Math.floor(90 * intensity); i++) {
              const a = rand(0, Math.PI * 2);
              const sp = rand(40, 120);
              push({
                x,
                y,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp,
                life: 1,
                decay: rand(0.01, 0.018),
                size: rand(6, 18),
                color: "#9e9e9e",
                shape: "circle",
                gravity: -0.015,
                drag: 0.94,
                opacity: 0.35
              });
            }
            break;
          }
          case "firework": {
            const N = Math.floor(130 * intensity);
            const pal = PALETTES.firework;
            for (let i = 0; i < N; i++) {
              const a = rand(0, Math.PI * 2);
              const sp = rand(180, 520);
              push({
                x,
                y,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp,
                life: 1,
                decay: rand(0.012, 0.02),
                size: rand(1.2, 2.6),
                color: pick(pal),
                shape: "circle",
                gravity: 0.18,
                drag: 0.988,
                opacity: 1,
                blend: "lighter"
              });
            }
            for (let i = 0; i < Math.floor(50 * intensity); i++) {
              push({
                x,
                y,
                vx: rand(-120, 120),
                vy: rand(-120, 120),
                life: 1,
                decay: rand(0.04, 0.07),
                size: rand(1, 1.6),
                color: "#ffffff",
                shape: "square",
                gravity: 0.25,
                drag: 0.95,
                opacity: 1,
                blend: "lighter"
              });
            }
            break;
          }
          case "pixel": {
            const N = Math.floor(140 * intensity);
            for (let i = 0; i < N; i++) {
              push({
                x,
                y,
                vx: rand(-360, 360),
                vy: rand(-360, 360),
                life: 1,
                decay: rand(0.01, 0.02),
                size: rand(2, 4),
                color: pick(PALETTES.pixel),
                shape: "square",
                gravity: 0.28,
                drag: 0.985,
                opacity: 1
              });
            }
            break;
          }
          case "electric": {
            const N = Math.floor(90 * intensity);
            for (let i = 0; i < N; i++) {
              push({
                x,
                y,
                vx: rand(-420, 420),
                vy: rand(-420, 420),
                life: 1,
                decay: rand(0.08, 0.12),
                size: rand(8, 14),
                color: pick(PALETTES.electric),
                shape: "line",
                gravity: 0.0,
                drag: 0.9,
                opacity: 1,
                blend: "lighter"
              });
            }
            push({
              x,
              y,
              vx: 0,
              vy: 0,
              life: 1,
              decay: 0.15,
              size: 28,
              color: "#ffffff",
              shape: "ring",
              opacity: 0.9,
              blend: "lighter"
            });
            break;
          }
        }
      }

      function draw(t) {
        if (t > nextSpawnAt) {
          const jitter = rand(0.6, 1.5);
          nextSpawnAt = t + settings.baseIntervalMs * jitter;
          const w = innerWidth;
          const h = innerHeight;
          if (settings.types.firework && Math.random() < 0.6) {
            spawnRocket(rand(0.1 * w, 0.9 * w), h + 20, -rand(360, 640));
          } else {
            triggerExplosion(
              rand(0.15 * w, 0.85 * w),
              rand(0.2 * h, 0.8 * h)
            );
          }
        }

        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(3,6,12,0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.vy += 0.18;
          r.x += r.vx * 0.016;
          r.y += r.vy * 0.016;
          r.trailCooldown -= 16;

          if (r.trailCooldown <= 0) {
            r.trailCooldown = rand(15, 28);
            particles.push({
              x: r.x + rand(-2, 2),
              y: r.y + rand(-2, 2),
              vx: rand(-10, 10),
              vy: rand(20, 60),
              life: 1,
              decay: rand(0.02, 0.04),
              size: rand(1, 2),
              color: "#ffd166",
              shape: "circle",
              gravity: 0.02,
              drag: 0.98,
              opacity: 0.9,
              blend: "lighter"
            });
          }

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.translate(r.x, r.y);
          ctx.fillStyle = r.color;
          ctx.beginPath();
          ctx.moveTo(0, -8);
          ctx.lineTo(-3, 8);
          ctx.lineTo(3, 8);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          if (r.y <= r.targetY || r.vy > -10) {
            triggerExplosion(r.x, r.y, "firework");
            rockets.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.vx *= p.drag ?? 1;
          p.vy *= p.drag ?? 1;
          p.vy += p.gravity ?? 0;
          p.x += p.vx * 0.016;
          p.y += p.vy * 0.016;
          p.rotation = (p.rotation || 0) + (p.spin || 0);
          p.life -= p.decay;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          const alpha = (p.opacity ?? 1) * clamp(p.life, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.globalCompositeOperation = p.blend || "source-over";
          ctx.translate(p.x, p.y);
          if (p.rotation) {
            ctx.rotate((p.rotation * Math.PI) / 180);
          }
          ctx.fillStyle = p.color;
          ctx.strokeStyle = p.color;

          switch (p.shape) {
            case "circle":
              ctx.beginPath();
              ctx.arc(0, 0, p.size, 0, Math.PI * 2);
              ctx.fill();
              break;
            case "square":
              ctx.fillRect(-p.size, -p.size, p.size * 2, p.size * 2);
              break;
            case "rect":
              ctx.fillRect(-p.size * 0.5, -p.size * 2, p.size, p.size * 4);
              break;
            case "ring":
              ctx.lineWidth = Math.max(1, p.size * 0.2);
              ctx.beginPath();
              ctx.arc(0, 0, p.size * 2, 0, Math.PI * 2);
              ctx.stroke();
              break;
            case "line":
              ctx.lineWidth = Math.max(1, p.size * 0.15);
              ctx.beginPath();
              ctx.moveTo(-p.size * 2, 0);
              ctx.lineTo(p.size * 2, 0);
              ctx.stroke();
              break;
          }

          ctx.restore();
        }

        if (particles.length > 3200) {
          particles.splice(0, particles.length - 3200);
        }

        raf = requestAnimationFrame(draw);
      }

      updatePanelUI();
      raf = requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
