<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inktober 2025 - Day 13</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at center, #f5deb3, #e0b95d);
    overflow: hidden;
    touch-action: none;
    font-family: system-ui, sans-serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #ui {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  #start {
    pointer-events: all;
    background: #fff8;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
    margin-bottom: 20px;
    cursor: pointer;
  }
  #status {
    color: #fff;
    font-size: 1.1rem;
    text-shadow: 0 0 6px rgba(0,0,0,0.4);
    margin-bottom: 40px;
    min-height: 1.2em;
  }
</style>
</head>
<body>

<canvas id="beerCanvas"></canvas>

<div id="ui">
  <button id="start">🍺 Start</button>
  <div id="status"></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('beerCanvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('start');
  const statusEl = document.getElementById('status');

  let width = 0, height = 0;

  let beta = 0, gamma = 0;
  let baseBeta = null, baseGamma = null;

  let beerLevel = 0.985;
  let empty = false;
  let time = 0;
  let animationStarted = false;

  const DRAIN_RATE = 0.18;
  const THRESH = 10;
  const MIN_LEVEL = 0.01;
  const FOAM_HEIGHT = 18;
  const AMPLITUDE = 8;
  const WAVELENGTH = 80;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function resize() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    width  = window.innerWidth;
    height = window.innerHeight;
    canvas.width  = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }

  window.addEventListener('resize', () => { resize(); drawBeer(); });
  resize();

  function drawBeer() {
    ctx.clearRect(0, 0, width, height);

    const midY = height * (1.1 - beerLevel);
    const tilt = -(gamma - (baseGamma ?? 0)) * 0.02;

    const wavePoints = [];
    for (let x = 0; x <= width; x += 6) {
      const angle = (x / WAVELENGTH) + time * 2;
      const y = midY + Math.sin(angle) * AMPLITUDE + x * tilt;
      wavePoints.push({ x, y });
    }

    const gradient = ctx.createLinearGradient(0, midY, 0, height);
    gradient.addColorStop(0, '#f5a623');
    gradient.addColorStop(1, '#c67c00');

    ctx.beginPath();
    ctx.moveTo(0, height);
    for (const p of wavePoints) ctx.lineTo(p.x, p.y);
    ctx.lineTo(width, height);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.beginPath();
    for (let i = 0; i < wavePoints.length; i++) {
      const p = wavePoints[i];
      const foamY = p.y - FOAM_HEIGHT;
      if (i === 0) ctx.moveTo(p.x, foamY);
      else ctx.lineTo(p.x, foamY);
    }
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#fff';
    ctx.shadowColor = 'rgba(255,255,255,0.6)';
    ctx.shadowBlur = 6;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function loop() {
    time += 0.016;

    if (baseBeta !== null) {
      if ((beta - baseBeta) <= -THRESH && !empty && beerLevel > MIN_LEVEL) {
        beerLevel -= DRAIN_RATE * 0.016;
        if (beerLevel <= MIN_LEVEL) {
          beerLevel = MIN_LEVEL;
          empty = true;
          statusEl.textContent = 'Shake to refill your glass 🍻';
        } else {
          statusEl.textContent = '🍺 Glug glug…';
        }
      } else if (!empty) {
        statusEl.textContent = '';
      }
    }

    drawBeer();
    requestAnimationFrame(loop);
  }

  function onShake(e) {
    if (!empty) return;
    const a = e.accelerationIncludingGravity || e.acceleration || {x:0,y:0,z:0};
    const shake = Math.abs(a.x) + Math.abs(a.y) + Math.abs(a.z);
    if (shake > 40) {
      beerLevel = 0.985;
      empty = false;
      statusEl.textContent = '';
    }
  }

  async function start() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== 'granted') {
          statusEl.textContent = 'Permission denied 😢';
          return;
        }
      } catch {
        statusEl.textContent = 'Permission error 😢';
        return;
      }
    }

    startBtn.style.display = 'none';
    statusEl.textContent = '';

    window.addEventListener('deviceorientation', (e) => {
      beta = e.beta || 0;
      gamma = e.gamma || 0;
      if (baseBeta === null)  baseBeta  = beta;
      if (baseGamma === null) baseGamma = gamma;
    });

    window.addEventListener('devicemotion', onShake);

    if (!animationStarted) {
      animationStarted = true;
      requestAnimationFrame(loop);
    }
  }

  drawBeer();
  startBtn.addEventListener('click', start);
})();
</script>

</body>
</html>
