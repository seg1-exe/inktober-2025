<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Inktober 2025 - Jour 17</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#0c111b; --text:#e6eef9; --muted:#9fb1c7; --border:#223246;
      --vh:100vh; /* remplacé par 100dvh si supporté */
    }
    @supports (height: 100dvh){ :root{ --vh:100dvh; } }

    html,body{
      height:100%; width:100%;
      margin:0; background:var(--bg); color:var(--text);
      font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      overflow:hidden; /* pas de scroll */
    }

    .app{
      display:grid;
      grid-template-rows:auto 1fr;
      min-height:var(--vh);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    header{
      position:sticky; top:0; z-index:10;
      display:flex; flex-direction:column; gap:8px;
      padding: 10px;
      border-bottom:1px solid var(--border);
      background:var(--panel);
    }
    .header-bar{
      display:flex; align-items:center; gap:8px; width:100%;
    }
    header h1{
      margin:0 8px 0 0;
      font-weight:600;
      font-size:16px; /* taille initiale desktop */
      white-space:nowrap;
    }
    .spacer{flex:1}

    /* Barre de contrôles (wrap multi-lignes, pas de scroll horizontal) */
    #controlsBar{
      display:flex; flex-wrap:wrap; align-items:center; gap:8px;
      width:100%;
    }
    #controlsBar[hidden]{ display:none; }

    label{ display:flex; align-items:center; gap:6px; }

    /* Styles initiaux des contrôles (desktop) */
    select,button,input[type="range"],input[type="number"],input[type="text"],input[type="color"]{
      appearance:none; border:1px solid var(--border);
      background:#111523; color:var(--text);
      border-radius:10px; padding:.5rem .7rem; font-weight:600;
    }
    button.primary{border-color:#184254; background:linear-gradient(180deg,#0e2a34,#0c2230)}
    .hint{color:var(--muted); font-size:12px}

    /* Affichages conditionnels */
    [data-hide="true"]{ display:none !important; }

    main{ min-height:0; padding-bottom: env(safe-area-inset-bottom); }
    svg{ display:block; width:100%; height:100%; }

    /* Mobile : cibles plus hautes, tout en gardant le style desktop */
    @media (max-width: 720px){
      select,button,input[type="range"],input[type="number"],input[type="text"],input[type="color"]{
        min-height:42px; font-size:13px;
      }
      header h1{ font-size:15px; }
      #seedInput{ width: 96px !important; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-bar">
      <h1>Girih / Zellige — Générateur</h1>
      <div class="spacer"></div>
      <button id="toggleControls" title="Masquer/Afficher les contrôles">Masquer contrôles</button>
      <button id="exportBtn" title="Exporter en SVG">⬇️ Export SVG</button>
    </div>

    <div id="controlsBar">
      <label>Mode
        <select id="modeSel">
          <option value="zellige">Zellige (étoiles + carrés)</option>
          <option value="girih">Girih (rosettes décagonales)</option>
        </select>
      </label>

      <label>Taille
        <input id="sizeRange" type="range" min="40" max="140" step="2" value="80">
      </label>

      <label>Complexité
        <input id="complexRange" type="range" min="1" max="5" step="1" value="3">
      </label>

      <!-- Zellige : deux color pickers (damier) -->
      <div id="zelligeColors">
        <label>Couleur A
          <input id="colA" type="color" value="#22d3ee">
        </label>
        <label>Couleur B
          <input id="colB" type="color" value="#0e7490">
        </label>
      </div>

      <!-- Girih : 4 color pickers (remplace la liste) -->
      <div id="girihColors">
        <label>C1 <input id="g1" type="color" value="#22d3ee"></label>
        <label>C2 <input id="g2" type="color" value="#0e7490"></label>
        <label>C3 <input id="g3" type="color" value="#164e63"></label>
        <label>C4 <input id="g4" type="color" value="#083344"></label>
      </div>

      <label class="row" style="gap:6px">
        <input type="checkbox" id="goldChk" checked> Dorure
      </label>

      <label>Seed
        <input id="seedInput" type="text" value="12345" style="width:120px" inputmode="numeric">
      </label>
      <button id="randSeed" title="Seed aléatoire">🎲</button>

      <span class="hint" aria-hidden="true">Astuce : sur mobile, les contrôles passent sur plusieurs lignes.</span>
    </div>
  </header>

  <main>
    <svg id="stage" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#7b5b11"/>
          <stop offset="25%" stop-color="#ffe5a3"/>
          <stop offset="55%" stop-color="#c7a23a"/>
          <stop offset="80%" stop-color="#fff6cd"/>
          <stop offset="100%" stop-color="#7b5b11"/>
        </linearGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="rgba(0,0,0,0.35)"/>
        </filter>
      </defs>
      <rect x="0" y="0" width="1600" height="900" fill="#0b1020"/>
      <g id="tiles" filter="url(#softShadow)"></g>
    </svg>
  </main>
</div>

<script>
  // ===== Utilities =====
  const $ = s => document.querySelector(s);
  const stage = $('#stage');
  const gTiles = $('#tiles');

  // Fix hauteur viewport mobile
  function setViewportVhVar(){
    const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight) + 'px';
    document.documentElement.style.setProperty('--vh', h);
  }
  window.addEventListener('resize', setViewportVhVar);
  window.addEventListener('orientationchange', setViewportVhVar);
  setViewportVhVar();

  function mulberry32(a){ return function(){ let t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; } }
  const TAU = Math.PI*2; const DEG = Math.PI/180; const PHI = (1+Math.sqrt(5))/2;

  function star8Path(cx, cy, R=40, r=18, rot=-90*DEG){
    const pts=[]; for(let i=0;i<16;i++){ const a = rot + i*(TAU/16); const rad = (i%2===0?R:r); pts.push([cx+Math.cos(a)*rad, cy+Math.sin(a)*rad]); }
    return 'M '+pts.map(p=>p[0]+','+p[1]).join(' L ')+' Z';
  }
  function squarePath(cx, cy, s=56, rot=45*DEG){
    const h=s/2; const pts=[[ -h,-h],[h,-h],[h,h],[-h,h]].map(([x,y])=>{
      const X = cx + x*Math.cos(rot) - y*Math.sin(rot);
      const Y = cy + x*Math.sin(rot) + y*Math.cos(rot);
      return [X,Y];
    });
    return 'M '+pts.map(p=>p[0]+','+p[1]).join(' L ')+' Z';
  }
  function decagonPoints(cx, cy, R, rot=0){ return Array.from({length:10}, (_,i)=>{ const a=rot + i*36*DEG; return [cx+Math.cos(a)*R, cy+Math.sin(a)*R]; }); }
  function pathFromPoints(pts){ return 'M '+pts.map(p=>p[0]+','+p[1]).join(' L ')+' Z'; }

  // ===== Controls =====
  const modeSel = $('#modeSel');
  const sizeRange = $('#sizeRange');
  const complexRange = $('#complexRange');
  const goldChk = $('#goldChk');
  const seedInput = $('#seedInput');
  const randSeedBtn = $('#randSeed');
  const exportBtn = $('#exportBtn');
  const toggleBtn = $('#toggleControls');

  // Color pickers
  const colAInput = $('#colA');
  const colBInput = $('#colB');
  const zelligeColors = $('#zelligeColors');

  const girihColors = $('#girihColors');
  const g1 = $('#g1'), g2 = $('#g2'), g3 = $('#g3'), g4 = $('#g4');

  function updateColorUI(){
    const isZellige = modeSel.value === 'zellige';
    zelligeColors.setAttribute('data-hide', isZellige ? 'false' : 'true');
    girihColors.setAttribute('data-hide', isZellige ? 'true' : 'false');
  }

  // Toggle contrôles
  const controlsBar = $('#controlsBar');
  let controlsVisible = true;
  toggleBtn.addEventListener('click', ()=>{
    controlsVisible = !controlsVisible;
    controlsBar.hidden = !controlsVisible;
    toggleBtn.textContent = controlsVisible ? 'Masquer contrôles' : 'Afficher contrôles';
  });

  // ===== Generators =====
  function generate(){
    const mode = modeSel.value;
    const size = +sizeRange.value;
    const complexity = +complexRange.value;
    const gold = goldChk.checked;
    const seed = seedInput.value.trim();
    const rng = mulberry32(hashSeed(seed));
    gTiles.innerHTML='';

    if(mode==='zellige'){
      const colA = colAInput.value;
      const colB = colBInput.value;
      generateZellige({size, complexity, gold, rng, colA, colB});
    } else {
      // Palette Girih = 4 pickers
      const palette = [g1.value, g2.value, g3.value, g4.value];
      generateGirih({size, complexity, gold, rng, palette});
    }
  }

  function hashSeed(s){
    if(!s) return 123456789;
    let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h>>>0;
  }
  function randChoice(rng, arr){ return arr[Math.floor(rng()*arr.length)] }

  function addPath(d, fill, strokeGold){
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', d); p.setAttribute('fill', fill);
    p.setAttribute('stroke', strokeGold ? 'url(#gold)' : '#000'); p.setAttribute('stroke-width','3');
    gTiles.appendChild(p);
  }

  // ---- Zellige (damier avec color pickers)
  function generateZellige({size, complexity, gold, rng, colA, colB}){
    const vb = stage.viewBox.baseVal; const step = size;
    const prob = 0.65 + (complexity-3)*0.07; // 1..5 → ~[0.37..0.93]
    for(let y=step*0.6; y<vb.height; y+=step){
      for(let x=step*0.6; x<vb.width; x+=step){
        const parity = ((Math.floor(x/step)+Math.floor(y/step))%2===0);
        if(parity){
          const rotSteps = [0,1,2,3,4,5,6,7];
          const rot = randChoice(rng, rotSteps) * (Math.PI/4);
          const d = star8Path(x, y, step*0.44, step*0.19, -Math.PI/2 + rot);
          addPath(d, colA, gold);
        } else if(rng() < prob){
          const d = squarePath(x, y, step*0.66, 45*DEG);
          addPath(d, colB, gold);
        }
      }
    }
  }

  // ---- Girih (palette depuis color pickers)
  function generateGirih({size, complexity, gold, rng, palette}){
    const vb = stage.viewBox.baseVal;
    const base = size; // rayon de base
    const rings = Math.max(1, Math.min(4, complexity));
    const spacing = base * PHI * 1.45;
    const jitter = base * 0.22;
    const rotSnap = 36*DEG;

    for(let y = base; y < vb.height; y += spacing){
      for(let x = base; x < vb.width; x += spacing){
        if(rng() < 0.08) continue;
        const jx = (rng()*2-1)*jitter; const jy = (rng()*2-1)*jitter;
        const rot = Math.floor(rng()*10)*rotSnap;
        drawRosette(x+jx, y+jy, base, rings, rot, gold, rng, palette);
      }
    }
  }

  function drawRosette(cx, cy, base, rings, rot, gold, rng, palette){
    const R1 = base, pts1 = decagonPoints(cx, cy, R1, rot);
    addPath(pathFromPoints(pts1), randChoice(rng, palette), gold);

    let prevPts = pts1; let R = R1;
    for(let k=1; k<rings; k++){
      const Rnext = R * PHI;
      const pts2 = decagonPoints(cx, cy, Rnext, rot + (k%2?18*DEG:0));
      for(let i=0;i<10;i++){
        const a = prevPts[i]; const b = prevPts[(i+1)%10];
        const c = pts2[(i+1)%10]; const d = pts2[i];
        addPath(pathFromPoints([a,b,c,d]), randChoice(rng, palette), gold);
      }
      addPath(pathFromPoints(pts2), randChoice(rng, palette), gold);
      prevPts = pts2; R = Rnext;
    }
  }

  // ===== Export =====
  function exportSVG(){
    const clone = stage.cloneNode(true);
    const xml = `<?xml version="1.0" encoding="UTF-8"?>\n` + clone.outerHTML;
    const blob = new Blob([xml], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `ornate-${modeSel.value}.svg`; a.click();
    URL.revokeObjectURL(url);
  }

  // ===== Bindings =====
  function randomizeSeed(){ seedInput.value = Math.floor(Math.random()*1e9).toString(36); }

  exportBtn.addEventListener('click', exportSVG, {passive:true});
  randSeedBtn.addEventListener('click', ()=>{ randomizeSeed(); generate(); }, {passive:true});

  modeSel.addEventListener('change', ()=>{ updateColorUI(); generate(); }, {passive:true});
  sizeRange.addEventListener('input', generate, {passive:true});
  complexRange.addEventListener('input', generate, {passive:true});
  goldChk.addEventListener('change', generate, {passive:true});

  // Color pickers live
  colAInput.addEventListener('input', generate, {passive:true});
  colBInput.addEventListener('input', generate, {passive:true});
  [g1,g2,g3,g4].forEach(inp=> inp.addEventListener('input', generate, {passive:true}));

  // Init
  updateColorUI();
  generate();
</script>
</body>
</html>
