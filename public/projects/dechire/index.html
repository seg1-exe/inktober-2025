<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Inktober 2025 - Jour 12</title>
<style>
  body {
    margin: 0;
    background: #eee7db;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    text-align: center;
  }
  #setup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    background: rgba(255,255,255,0.9);
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
  }
  #preview {
    max-width: 90vw;
    max-height: 50vh;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    object-fit: contain;
    display: none;
  }
  input, select, button {
    font-size: 16px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #999;
  }
  button {
    background: #4b2e05;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover {
    background: #6b4513;
  }
  #container {
    display: none;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 90vw;
    margin-top: 20px;
  }
  canvas {
    width: 100%;
    height: auto;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    border-radius: 10px;
    cursor: grab;
    display: block;
    touch-action: none;
  }
  #puzzleArea {
    background: #fff;
    border: 3px dashed #999;
  }
  #piecesArea {
    background: #d4c5b0;
  }
  #win {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(255,255,255,0.95);
    padding: 20px 30px;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
    font-weight: bold;
    font-size: clamp(1.2rem, 5vw, 2rem);
    z-index: 1000;
    max-width: 90vw;
    text-align: center;
  }
</style>
</head>
<body>

<div id="setup">
  <h1>Ça déchire</h1>
  <input type="file" id="fileInput" accept="image/*">
  <select id="difficulty">
    <option value="3x4">Facile (3×4)</option>
    <option value="5x8" selected>Moyen (5×8)</option>
    <option value="8x12">Difficile (8×12)</option>
  </select>
  <img id="preview" alt="Aperçu de l'image">
  <button id="startBtn">Déchirer l'image</button>
</div>

<div id="container">
  <canvas id="puzzleArea"></canvas>
  <canvas id="piecesArea"></canvas>
</div>

<div id="win">Bravo ! L'image est réparée</div>

<script>
const setup=document.getElementById('setup');
const fileInput=document.getElementById('fileInput');
const preview=document.getElementById('preview');
const startBtn=document.getElementById('startBtn');
const difficultySelect=document.getElementById('difficulty');
const container=document.getElementById('container');
const puzzleCanvas=document.getElementById('puzzleArea');
const piecesCanvas=document.getElementById('piecesArea');
const puzzleCtx=puzzleCanvas.getContext('2d');
const piecesCtx=piecesCanvas.getContext('2d');
const winEl=document.getElementById('win');

let img=new Image();
let pieces=[];
let selected=null;
let gameOver=false;
let rows=5,cols=8;
let imgAspect=1;

// ---- UTIL BRUIT
function hash2(a,b){let x=(a|0)*374761393^(b|0)*668265263;x=(x^x>>>13)*1274126177;return(x^x>>>16)>>>0;}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
function smoothstep(t){return t*t*(3-2*t);}
function valueNoise1D(t,rng){const i=Math.floor(t),f=t-i,v1=rng(i),v2=rng(i+1);return v1+(v2-v1)*smoothstep(f);}
function fbm1D(t,seed,oct=4){let a=1,f=1,s=0,n=0;for(let o=0;o<oct;o++){const N=valueNoise1D(t*f,k=>mulberry32(hash2(seed+o*10007,k))());s+=N*a;n+=a;a*=.5;f*=2;}return s/n;}
function makeSharedEdge(start,end,{isOuter=false,axis='vertical',steps=40,amp=10,seed=1}={}) {
  const pts=[];const dx=(end.x-start.x)/steps;const dy=(end.y-start.y)/steps;
  for(let i=0;i<=steps;i++){const t=i/steps;let x=start.x+dx*i,y=start.y+dy*i;
    if(!isOuter){const fade=Math.min(t/0.18,(1-t)/0.18,1);const taper=smoothstep(fade);
      const n=fbm1D(i*0.75,seed);const off=(n-0.5)*2*amp*taper;if(axis==='vertical')x+=off;else y+=off;}
    pts.push({x,y});}
  return pts;
}

// ---- UPLOAD IMAGE
fileInput.addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{preview.src=ev.target.result;preview.style.display='block';};
  reader.readAsDataURL(file);
});

// ---- START
startBtn.addEventListener('click',()=>{
  const val=difficultySelect.value.split('x');
  rows=parseInt(val[0]);cols=parseInt(val[1]);
  if(!preview.src)return alert("Choisis une image d'abord !");
  setup.style.display='none';container.style.display='flex';winEl.style.display='none';
  initGame(preview.src);
});

function resizeToImage(){
  const maxW=Math.min(window.innerWidth*0.9,800);
  const w=maxW;const h=w/imgAspect;
  puzzleCanvas.width=w;puzzleCanvas.height=h;
  piecesCanvas.width=w;piecesCanvas.height=Math.floor(h*0.55);
}

function initGame(src){
  img=new Image();
  img.onload=()=>{imgAspect=img.naturalWidth/img.naturalHeight;resizeToImage();buildPuzzle(rows,cols);};
  img.src=src;
}

function buildPuzzle(rows,cols){
  const pw=puzzleCanvas.width/cols;const ph=puzzleCanvas.height/rows;
  const AMP=Math.max(5,14-(rows+cols)/3);
  const vEdges=Array.from({length:cols+1},()=>Array(rows));
  const hEdges=Array.from({length:rows+1},()=>Array(cols));
  pieces=[];

  for(let c=0;c<=cols;c++){
    for(let r=0;r<rows;r++){
      const s={x:c*pw,y:r*ph},e={x:c*pw,y:(r+1)*ph},outer=c===0||c===cols;
      vEdges[c][r]=makeSharedEdge(s,e,{isOuter:outer,axis:'vertical',amp:AMP,seed:hash2(1000+c,r)});
    }
  }
  for(let r=0;r<=rows;r++){
    for(let c=0;c<cols;c++){
      const s={x:c*pw,y:r*ph},e={x:(c+1)*pw,y:r*ph},outer=r===0||r===rows;
      hEdges[r][c]=makeSharedEdge(s,e,{isOuter:outer,axis:'horizontal',amp:AMP,seed:hash2(2000+r,c)});
    }
  }

  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const piece={sx:x*pw,sy:y*ph,x:Math.random()*(piecesCanvas.width-pw),
        y:Math.random()*(piecesCanvas.height-ph),w:pw,h:ph,path:new Path2D(),inPuzzle:false};
      const p=piece.path;
      const top=hEdges[y][x],right=vEdges[x+1][y],bottom=hEdges[y+1][x],left=vEdges[x][y];
      p.moveTo(top[0].x,top[0].y);
      top.forEach(pt=>p.lineTo(pt.x,pt.y));
      right.forEach(pt=>p.lineTo(pt.x,pt.y));
      bottom.slice().reverse().forEach(pt=>p.lineTo(pt.x,pt.y));
      left.slice().reverse().forEach(pt=>p.lineTo(pt.x,pt.y));
      p.closePath();
      pieces.push(piece);
    }
  }

  gameOver=false;requestAnimationFrame(draw);
}

function draw(){
  puzzleCtx.clearRect(0,0,puzzleCanvas.width,puzzleCanvas.height);
  piecesCtx.clearRect(0,0,piecesCanvas.width,piecesCanvas.height);
  pieces.forEach(p=>{
    const ctx=p.inPuzzle?puzzleCtx:piecesCtx;
    ctx.save();ctx.translate(p.x-p.sx,p.y-p.sy);
    ctx.clip(p.path);
    ctx.drawImage(img,0,0,puzzleCanvas.width,puzzleCanvas.height);
    ctx.restore();
  });
  if(!gameOver)requestAnimationFrame(draw);
}

// ---- DRAG
function getEventPos(e,canvas){
  const rect=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-rect.left,y:t.clientY-rect.top};
}

function startDrag(e){
  const canvas=e.target,pos=getEventPos(e,canvas);
  const isPuzzle=canvas===puzzleCanvas;
  const filtered=pieces.filter(p=>(isPuzzle&&p.inPuzzle)||(!isPuzzle&&!p.inPuzzle));
  selected=filtered.findLast(p=>{
    const ctx=canvas.getContext('2d');
    ctx.save();ctx.translate(p.x-p.sx,p.y-p.sy);
    const hit=ctx.isPointInPath(p.path,pos.x,pos.y);
    ctx.restore();return hit;
  });
  if(selected){selected.offsetX=pos.x-selected.x;selected.offsetY=pos.y-selected.y;}
}

function moveDrag(e){
  if(!selected)return;
  e.preventDefault();
  const rectPieces=piecesCanvas.getBoundingClientRect();
  const rectPuzzle=puzzleCanvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e,gx=t.clientX,gy=t.clientY;
  const over=gy>=rectPuzzle.top&&gy<=rectPuzzle.bottom&&gx>=rectPuzzle.left&&gx<=rectPuzzle.right;
  selected.inPuzzle=over;
  const rect=over?rectPuzzle:rectPieces;

  // Nouvelle position
  selected.x=gx-rect.left-selected.offsetX;
  selected.y=gy-rect.top-selected.offsetY;

  // 🧱 Empêche la pièce de sortir du canvas
  const maxX=rect.width-selected.w;
  const maxY=rect.height-selected.h;
  selected.x=Math.min(Math.max(selected.x,0),maxX);
  selected.y=Math.min(Math.max(selected.y,0),maxY);
}

function endDrag(){
  if(selected){
    const tol=10;
    if(selected.inPuzzle&&Math.abs(selected.x-selected.sx)<tol&&Math.abs(selected.y-selected.sy)<tol){
      selected.x=selected.sx;selected.y=selected.sy;
    }
    checkSolved();
  }
  selected=null;
}

['mousedown','touchstart'].forEach(ev=>{
  puzzleCanvas.addEventListener(ev,startDrag);
  piecesCanvas.addEventListener(ev,startDrag);
});
['mousemove','touchmove'].forEach(ev=>document.addEventListener(ev,moveDrag,{passive:false}));
['mouseup','touchend'].forEach(ev=>document.addEventListener(ev,endDrag));

function checkSolved(){
  const solved=pieces.every(p=>p.x===p.sx&&p.y===p.sy&&p.inPuzzle);
  if(solved){gameOver=true;winEl.style.display='block';}
}
</script>
</body>
</html>
