<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arbre organique 🌳</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at bottom, #cde5d1 0%, #a4c9a2 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Georgia', serif;
    color: #2f4f2f;
  }

  h1 {
    margin-bottom: 20px;
    text-shadow: 1px 1px 0 #dbeed0;
  }

  canvas {
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    background: linear-gradient(to top, #cde5d1, #f4fff4);
  }

  button {
    margin-top: 25px;
    padding: 12px 24px;
    background: #3f633f;
    color: #f0f6f0;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.3s, transform 0.1s;
  }

  button:active {
    transform: scale(0.97);
    background: #4e7c4e;
  }
</style>
</head>
<body>
  <h1>Maintiens pour faire pousser ton arbre 🌱</h1>
  <canvas id="treeCanvas" width="500" height="500"></canvas>
  <button id="growBtn">Souffle (maintiens)</button>

  <script>
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const growBtn = document.getElementById('growBtn');

    let growing = false;
    let tree = {
      trunkHeight: 0,
      trunkMax: 200,
      branches: [],
      branchChance: 0.15, // probabilité d'apparition d'une branche
      growingBranches: [],
    };

    // Démarrage
    function initTree() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tree.trunkHeight = 0;
      tree.branches = [];
      tree.growingBranches = [];
      drawTree();
    }

    // Dessin global
    function drawTree() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dessine le tronc
      ctx.strokeStyle = '#5b3e26';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, canvas.height);
      ctx.lineTo(canvas.width / 2, canvas.height - tree.trunkHeight);
      ctx.stroke();

      // Dessine les branches
      for (let b of tree.branches) {
        drawBranch(b);
      }
    }

    // Dessine une branche donnée
    function drawBranch(b) {
      ctx.strokeStyle = '#4c3724';
      ctx.lineWidth = Math.max(6 - b.depth, 1.5);
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + Math.cos(b.angle) * b.length, b.y + Math.sin(b.angle) * b.length);
      ctx.stroke();

      // Feuilles quand la branche a fini
      if (b.grown && b.depth > 1) {
        ctx.beginPath();
        ctx.fillStyle = `hsl(${100 + Math.random() * 20}, 50%, 45%)`;
        ctx.arc(
          b.x + Math.cos(b.angle) * b.length,
          b.y + Math.sin(b.angle) * b.length,
          4 + Math.random() * 2,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
    }

    // Croissance du tronc
    function growTrunk() {
      if (tree.trunkHeight < tree.trunkMax) {
        tree.trunkHeight += 2;

        // Chance qu'une branche pousse sur le côté
        if (Math.random() < tree.branchChance && tree.trunkHeight > 50) {
          const angle = (Math.random() < 0.5 ? -1 : 1) * (Math.PI / 6 + Math.random() * 0.2);
          const y = canvas.height - tree.trunkHeight;
          const branch = {
            x: canvas.width / 2,
            y,
            angle,
            length: 0,
            maxLength: 40 + Math.random() * 30,
            depth: 1,
            grown: false,
          };
          tree.growingBranches.push(branch);
          tree.branches.push(branch);
        }
      } else {
        // Une fois le tronc terminé, on fait pousser les branches
        growBranches();
      }
    }

    // Croissance des branches existantes
    function growBranches() {
      for (let b of tree.growingBranches) {
        if (b.length < b.maxLength) {
          b.length += 1.5;

          // Chance de sous-branche
          if (b.length > b.maxLength * 0.5 && !b.spawned && Math.random() < 0.1 && b.depth < 3) {
            const subAngle = b.angle + (Math.random() < 0.5 ? -1 : 1) * (Math.PI / 6);
            const branch = {
              x: b.x + Math.cos(b.angle) * (b.length * 0.8),
              y: b.y + Math.sin(b.angle) * (b.length * 0.8),
              angle: subAngle,
              length: 0,
              maxLength: b.maxLength * (0.7 + Math.random() * 0.3),
              depth: b.depth + 1,
              grown: false,
            };
            tree.branches.push(branch);
            tree.growingBranches.push(branch);
            b.spawned = true;
          }
        } else {
          b.grown = true;
        }
      }

      // Nettoyage des branches finies
      tree.growingBranches = tree.growingBranches.filter(b => !b.grown);
    }

    // Boucle principale
    function update() {
      if (growing) {
        growTrunk();
        drawTree();
      }
      requestAnimationFrame(update);
    }

    // Gestion du bouton (hold)
    growBtn.addEventListener('mousedown', () => (growing = true));
    growBtn.addEventListener('mouseup', () => (growing = false));
    growBtn.addEventListener('mouseleave', () => (growing = false));
    growBtn.addEventListener('touchstart', () => (growing = true));
    growBtn.addEventListener('touchend', () => (growing = false));

    initTree();
    update();
  </script>
</body>
</html>
