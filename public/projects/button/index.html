<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inktober 2025 — Day 22</title>
<style>
  :root{
    --bg:#008080;           /* Win9x-style background */
    --text:#000;
    --win-face:#c0c0c0;     /* Win9x palette */
    --win-light:#ffffff;
    --win-shadow:#808080;
    --win-dark:#000000;
    --bluebar:#000080;
    --bluebar-text:#ffffff;
  }

  /* Fullscreen (no global scroll) */
  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Tahoma, "MS Sans Serif", system-ui, sans-serif;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }

  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    touch-action:none;
  }

  /* Ambient overlay (optional) */
  .flood-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    mix-blend-mode:soft-light;
    opacity:.75;
    transition:opacity .4s ease;
    background:radial-gradient(120% 80% at 50% 100%, #fff0 0, #fff0 45%, rgba(0,0,0,.35) 100%);
  }

  /* HUD bottom-right */
  #hud{
    position:absolute;
    right:calc(8px + env(safe-area-inset-right));
    bottom:calc(8px + env(safe-area-inset-bottom));
    display:flex;
    gap:8px;
    z-index:9999;
  }

  .hud-btn{
    display:inline-block;
    padding:6px 12px;
    background:#ffffffcc;
    border:1px solid rgba(0,0,0,.3);
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
  }

  .hud-btn:hover{ background:#fff; }

  /* ===================== Base dialog ===================== */
  .dlg{
    position:absolute;
    width:min(560px, 92vw);
    max-width:92vw;
    max-height:calc(100dvh - 24px);
    display:grid;
    grid-template-rows:auto 1fr auto;
    overflow:hidden;
    user-select:none;
  }

  .dlg__content{
    padding:12px 14px;
    display:grid;
    grid-template-columns:20px 1fr;
    gap:10px;
    align-items:start;
    background:#fff;
    color:#0f172a;
    overflow:auto;
  }

  .dlg__content .icon{
    font-size:18px;
    line-height:1;
  }

  .dlg__actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding:10px 14px 14px;
    background:#fff;
  }

  .dlg h2{
    margin:0 0 6px;
    font-size:15px;
  }

  /* Pop-in animation */
  .pop-in{ animation:pop-in .22s ease-out; }

  @keyframes pop-in{
    from{ transform:scale(.98); filter:blur(1px); opacity:0 }
    to{ transform:scale(1); filter:none; opacity:1 }
  }

  @media (prefers-reduced-motion:reduce){
    .pop-in{ animation:none }
  }

  /* ===================== Buttons ===================== */
  .btn{
    appearance:none;
    cursor:pointer;
    padding:.5rem 1rem;
    font-weight:700;
    letter-spacing:.01em;
  }

  .btn:focus-visible{
    outline:2px solid #000;
    outline-offset:2px;
  }

  .btn--macos{
    background:linear-gradient(#fefefe,#e7e7e7);
    border:1px solid #b9b9b9;
    color:#0f172a;
    border-radius:12px;
    box-shadow:0 1px 0 #fff inset,
               0 6px 14px rgba(0,0,0,.12),
               0 1px 0 rgba(0,0,0,.07);
  }

  .btn--macos:active{
    background:linear-gradient(#e6e6e6,#f1f1f1);
    transform:translateY(1px);
  }

  .btn--macos-classic{
    font:700 14px/1 "Geneva","Lucida Grande",system-ui,sans-serif;
    background:#d9d9d9;
    color:#000;
    border:2px solid;
    border-color:#fff #404040 #404040 #fff;
    border-radius:4px;
    box-shadow: inset -1px -1px 0 #000,
                inset 1px 1px 0 #b5b5b5;
  }

  .btn--macos-classic:active{
    border-color:#404040 #fff #fff #404040;
    background:#c9c9c9;
  }

  .btn--win98{
    font:400 13px/1 "MS Sans Serif",Tahoma,Verdana,sans-serif;
    background:var(--win-face);
    color:#000;
    border:2px solid var(--win-face);
    box-shadow: inset -1px -1px 0 var(--win-dark),
                inset 1px 1px 0 var(--win-light),
                inset -2px -2px 0 var(--win-shadow),
                inset 2px 2px 0 #fff;
  }

  .btn--win98:active{
    box-shadow: inset -1px -1px 0 var(--win-light),
                inset 1px 1px 0 var(--win-dark),
                inset -2px -2px 0 #fff,
                inset 2px 2px 0 var(--win-shadow);
  }

  .btn--xp{
    font-family:Tahoma,"Segoe UI",Verdana,sans-serif;
    background:linear-gradient(#6aa2ff,#3373e6);
    color:#fff;
    border:1px solid #245edc;
    border-radius:6px;
    text-shadow:0 1px 0 rgba(0,0,0,.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35),
                0 2px 0 rgba(0,0,0,.15);
  }

  .btn--xp:active{
    background:linear-gradient(#2f6dd2,#578fe6);
    transform:translateY(1px);
  }

  .btn--win10{
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    background:#0078d4;
    color:#fff;
    border:none;
    border-radius:3px;
    box-shadow:0 1px 2px rgba(0,0,0,.2);
  }

  .btn--win10:active{
    background:#005a9e;
    transform:translateY(1px);
  }

  .btn--game{
    font:700 14px/1 "Courier New",ui-monospace,monospace;
    text-transform:uppercase;
    letter-spacing:.08em;
    background:#e23b3b;
    color:#fff;
    border:4px solid #000;
    border-radius:0;
    padding:.6rem 1.2rem;
    box-shadow:0 0 0 4px #fff,
               0 8px 0 0 #000;
  }

  .btn--game:active{
    box-shadow:0 0 0 4px #fff,
               0 3px 0 0 #000;
    transform:translateY(5px);
  }

  /* ===================== Titlebars & styles ===================== */
  .dlg--macos{
    background:#fff;
    border:1px solid rgba(0,0,0,.12);
    box-shadow:0 20px 60px rgba(2,6,23,.18),
               0 1px 0 rgba(2,6,23,.06);
    border-radius:14px;
  }

  .tb--macos{
    display:flex;
    align-items:center;
    gap:8px;
    height:32px;
    padding:0 12px;
    background:linear-gradient(#f6f6f6,#ebebeb);
    border-bottom:1px solid rgba(0,0,0,.08);
  }

  .dots{ display:flex; gap:6px; }
  .dot{ width:12px; height:12px; border-radius:999px; }
  .dot.red{ background:#ff5f57; }
  .dot.amber{ background:#ffbd2e; }
  .dot.green{ background:#28c840; }

  .tb-title{
    margin-left:6px;
    font-weight:600;
    font-size:13px;
    color:#0f172a;
  }

  .dlg--macos-classic{
    background:#d9d9d9;
    border:2px solid;
    border-color:#fff #404040 #404040 #fff;
    border-radius:6px;
    box-shadow:inset -1px -1px 0 #000,
               inset 1px 1px 0 #b5b5b5;
  }

  .tb--macclassic{
    background:#d0d0d0;
    border-bottom:2px solid;
    border-color:#fff #404040 #404040 #fff;
    padding:4px 10px;
    text-align:center;
    font:700 14px/1 "Geneva","Lucida Grande",system-ui,sans-serif;
  }

  .dlg--macos-classic .dlg__content,
  .dlg--macos-classic .dlg__actions{
    background:#d9d9d9;
  }

  .dlg--win98{
    background:var(--win-face);
    border:2px solid var(--win-face);
    box-shadow:inset -1px -1px 0 var(--win-dark),
               inset 1px 1px 0 var(--win-light),
               inset -2px -2px 0 var(--win-shadow),
               inset 2px 2px 0 #fff;
  }

  .tb--win98{
    height:26px;
    display:flex;
    align-items:center;
    padding:0 8px;
    color:#fff;
    background:linear-gradient(var(--bluebar), #1084d0);
    font:700 13px/1 "MS Sans Serif",Tahoma,Verdana,sans-serif;
  }

  .dlg--win98 .dlg__content,
  .dlg--win98 .dlg__actions{
    background:var(--win-face);
  }

  .dlg--xp{
    background:#ece9d8;
    border:1px solid #7f9db9;
    border-radius:6px;
    box-shadow:0 10px 24px rgba(0,0,0,.18);
  }

  .tb--xp{
    height:28px;
    display:flex;
    align-items:center;
    padding:0 10px;
    color:#fff;
    text-shadow:0 1px 0 rgba(0,0,0,.5);
    background:linear-gradient(#3a6ea5,#2b579a);
    font:700 13px/1 Tahoma,"Segoe UI",Verdana,sans-serif;
    border-top-left-radius:6px;
    border-top-right-radius:6px;
  }

  .dlg--win10{
    background:#fff;
    border:1px solid rgba(0,0,0,.12);
    border-radius:8px;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
  }

  .tb--win10{
    height:40px;
    display:flex;
    align-items:center;
    padding:0 12px;
    background:#f6f6f6;
    border-bottom:1px solid rgba(0,0,0,.08);
    font-weight:600;
  }

  .dlg--game{
    background:#fbf2cc;
    border:4px solid #000;
    box-shadow:0 0 0 6px #fff,
               0 12px 0 0 #000;
    border-radius:0;
  }

  .tb--game{
    background:#000;
    color:#fff;
    height:28px;
    display:flex;
    align-items:center;
    padding:0 10px;
    font:700 12px/1 "Courier New",ui-monospace,monospace;
    letter-spacing:.06em;
    text-transform:uppercase;
  }

  .dlg--game .dlg__content,
  .dlg--game .dlg__actions{
    background:#fbf2cc;
  }

  /* Windows 3.1 */
  .dlg--win3x{
    background:#c0c0c0;
    border:2px solid #c0c0c0;
    box-shadow:
      inset -1px -1px 0 #000,
      inset  1px  1px 0 #fff,
      inset -2px -2px 0 #808080,
      inset  2px  2px 0 #dfdfdf;
  }

  .tb--win3x{
    height:22px;
    display:flex;
    align-items:center;
    padding:0 6px;
    background:#000080;
    color:#fff;
    font:700 12px/1 "MS Sans Serif", Tahoma, Verdana, sans-serif;
  }

  .btn--win3x{
    font:400 13px/1 "MS Sans Serif", Tahoma, Verdana, sans-serif;
    background:#c0c0c0;
    color:#000;
    border:2px solid #c0c0c0;
    box-shadow:
      inset -1px -1px 0 #000,
      inset  1px  1px 0 #fff,
      inset -2px -2px 0 #808080,
      inset  2px  2px 0 #dfdfdf;
  }

  .btn--win3x:active{
    box-shadow:
      inset -1px -1px 0 #fff,
      inset  1px  1px 0 #000,
      inset -2px -2px 0 #dfdfdf,
      inset  2px  2px 0 #808080;
  }

  /* macOS Big Sur (glass) */
  .dlg--bigsur{
    background:rgba(255,255,255,.6);
    border:1px solid rgba(255,255,255,.45);
    border-radius:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.18);
    backdrop-filter:saturate(180%) blur(18px);
  }

  .tb--bigsur{
    display:flex;
    align-items:center;
    gap:8px;
    height:34px;
    padding:0 12px;
    background:linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,.28));
    border-bottom:1px solid rgba(255,255,255,.35);
  }

  .dlg--bigsur .dlg__content,
  .dlg--bigsur .dlg__actions{
    background:transparent;
  }

  .btn--bigsur{
    background:linear-gradient(#fefefe,#ececec);
    border:1px solid #c7c7c7;
    color:#0f172a;
    border-radius:12px;
    box-shadow:0 1px 0 #fff inset,
               0 6px 14px rgba(0,0,0,.12),
               0 1px 0 rgba(0,0,0,.07);
  }

  .btn--bigsur:active{
    transform:translateY(1px);
  }

  /* iOS Alert */
  .dlg--ios{
    background:#fff;
    border:1px solid rgba(0,0,0,.06);
    border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.25);
  }

  .tb--ios{ display:none; }

  .dlg--ios .dlg__actions{
    justify-content:space-evenly;
  }

  .btn--ios{
    background:#007aff;
    color:#fff;
    border:none;
    border-radius:12px;
    padding:.6rem 1.1rem;
    font-weight:700;
  }

  .btn--ios:active{
    transform:translateY(1px);
  }

  /* Material You (Android) */
  .dlg--material{
    background:#fff;
    border:1px solid rgba(0,0,0,.06);
    border-radius:16px;
    box-shadow:0 16px 40px rgba(0,0,0,.2);
  }

  .tb--material{ display:none; }

  .btn--material{
    background:#6750a4;
    color:#fff;
    border:none;
    border-radius:20px;
    padding:.55rem 1.1rem;
    font-weight:600;
  }

  .btn--material:active{
    transform:translateY(1px);
  }

  /* Game Boy */
  .dlg--gb{
    background:#c8d4a2;
    border:4px solid #2a2a2a;
    border-radius:0;
    box-shadow:0 0 0 6px #e0e5c1 inset;
  }

  .tb--gb{
    background:#2a2a2a;
    color:#c8d4a2;
    height:24px;
    display:flex;
    align-items:center;
    padding:0 8px;
    font:700 12px/1 "Courier New", ui-monospace, monospace;
    text-transform:uppercase;
    letter-spacing:.06em;
  }

  .dlg--gb .dlg__content,
  .dlg--gb .dlg__actions{
    background:#c8d4a2;
  }

  .btn--gb{
    background:#2a2a2a;
    color:#c8d4a2;
    border:2px solid #000;
    border-radius:0;
    padding:.5rem 1rem;
    box-shadow:0 3px 0 #000;
    font:700 14px/1 "Courier New", ui-monospace, monospace;
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  .btn--gb:active{
    transform:translateY(3px);
    box-shadow:0 0 0 #000;
  }

  .square-icon{
    width:16px;
    height:16px;
    background:linear-gradient(#fff,#ddd);
    border:1px solid #000;
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="overlay" class="flood-overlay" aria-hidden="true"></div>
  </div>

<script>
(function(){
  const stage   = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const restart = document.getElementById('btn-restart'); // (unused placeholder)

  let zTop = 10;
  let index = 0;
  let order = [];

  const clamp = (v,min,max) => Math.max(min, Math.min(max, v));

  function computeBoundsForMinVisibility(winW, winH, frac){
    const f = Math.max(0, Math.min(1, frac || 1));
    const VW = stage.clientWidth;
    const VH = stage.clientHeight;
    return {
      minX: - (1 - f) * winW,
      maxX: VW - f * winW,
      minY: - (1 - f) * winH,
      maxY: VH - f * winH
    };
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  const THEMES = [
    {
      key:'macos',
      label:'macOS (modern)',
      dlg:'dlg--macos',
      btn:'btn--macos',
      titlebar:(t)=>`<div class="tb--macos"><div class="dots"><span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span></div><div class="tb-title">${t}</div></div>`,
      title:'Alert',
      icon:'ℹ️',
      msg:'This is a macOS-style window. Press OK to continue.'
    },
    {
      key:'macos-classic',
      label:'Old macOS (System 8/9)',
      dlg:'dlg--macos-classic',
      btn:'btn--macos-classic',
      titlebar:(t)=>`<div class="tb--macclassic">${t}</div>`,
      title:'System Alert',
      icon:'❗️',
      msg:'Welcome to 1999. Sharp corners, crisp text.'
    },
    {
      key:'win98',
      label:'Windows 98',
      dlg:'dlg--win98',
      btn:'btn--win98',
      titlebar:(t)=>`<div class="tb--win98">${t}</div>`,
      title:'Windows',
      icon:'💾',
      msg:'Do you want to continue the operation? Click OK (or Enter).'
    },
    {
      key:'xp',
      label:'Windows XP (Luna)',
      dlg:'dlg--xp',
      btn:'btn--xp',
      titlebar:(t)=>`<div class="tb--xp">${t}</div>`,
      title:'Assistant',
      icon:'🪟',
      msg:'The Luna blue is shining. Let’s continue.'
    },
    {
      key:'win10',
      label:'Windows 10 / 11',
      dlg:'dlg--win10',
      btn:'btn--win10',
      titlebar:(t)=>`<div class="tb--win10">${t}</div>`,
      title:'Settings',
      icon:'⚙️',
      msg:'Modern experience with soft corners and crisp shadows.'
    },
    {
      key:'game',
      label:'Retro game style',
      dlg:'dlg--game',
      btn:'btn--game',
      titlebar:(t)=>`<div class="tb--game">${t}</div>`,
      title:'Level up!',
      icon:'👾',
      msg:'Press OK to reach the next level.'
    },
    {
      key:'win3x',
      label:'Windows 3.1',
      dlg:'dlg--win3x',
      btn:'btn--win3x',
      titlebar:(t)=>`<div class="tb--win3x">${t}</div>`,
      title:'Program Manager',
      icon:'🧩',
      msg:'Operation completed successfully.'
    },
    {
      key:'bigsur',
      label:'macOS Big Sur (glass)',
      dlg:'dlg--bigsur',
      btn:'btn--bigsur',
      titlebar:(t)=>`<div class="tb--bigsur"><div class="dots"><span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span></div><div class="tb-title">${t}</div></div>`,
      title:'Alert',
      icon:'🧊',
      msg:'Translucent alert. Press OK to continue.'
    },
    {
      key:'ios',
      label:'iOS',
      dlg:'dlg--ios',
      btn:'btn--ios',
      titlebar:()=>``,
      title:'Alert',
      icon:'📱',
      msg:'This looks like an iOS alert. Press OK to close.'
    },
    {
      key:'material',
      label:'Android (Material You)',
      dlg:'dlg--material',
      btn:'btn--material',
      titlebar:()=>``,
      title:'Confirm',
      icon:'🤖',
      msg:'Rounded Material buttons. Press OK.'
    },
    {
      key:'gb',
      label:'Game Boy',
      dlg:'dlg--gb',
      btn:'btn--gb',
      titlebar:(t)=>`<div class="tb--gb">${t}</div>`,
      title:'LINK CABLE',
      icon:'🔌',
      msg:'Press OK to continue.'
    },
  ];

  function nextOrder(){
    order = shuffle([...Array(THEMES.length).keys()]);
    index = 0;
  }

  function randomPositionFor(size){
    const {minX,maxX,minY,maxY} = computeBoundsForMinVisibility(size.w, size.h, 1);
    const x = Math.round(minX + Math.random()*(maxX - minX));
    const y = Math.round(minY + Math.random()*(maxY - minY));
    return {x,y};
  }

  function renderDialogByIndex(i){
    const theme = THEMES[ order[i] ];
    const dlg = document.createElement('div');
    dlg.className = `dlg ${theme.dlg} pop-in`;
    dlg.setAttribute('role','dialog');
    dlg.setAttribute('aria-modal','true');
    dlg.style.visibility = 'hidden';
    dlg.style.left = '0px';
    dlg.style.top = '0px';
    dlg.style.zIndex = (++zTop).toString();

    const id = 'dlgTitle-' + Math.random().toString(36).slice(2,7);
    const desc = 'dlgDesc-' + Math.random().toString(36).slice(2,7);

    dlg.innerHTML = `
      ${theme.titlebar(theme.title)}
      <div class="dlg__content">
        <div class="icon" aria-hidden="true">${theme.icon}</div>
        <div>
          <h2 id="${id}">${theme.title}</h2>
          <p id="${desc}" style="margin:0">${theme.msg}</p>
        </div>
      </div>
      <div class="dlg__actions">
        <button id="okBtn" class="btn ${theme.btn}" type="button">OK</button>
      </div>`;

    dlg.setAttribute('aria-labelledby', id);
    dlg.setAttribute('aria-describedby', desc);

    stage.appendChild(dlg);

    const r = dlg.getBoundingClientRect();
    const pos = randomPositionFor({w:r.width||320,h:r.height||180});
    dlg.style.left = pos.x + 'px';
    dlg.style.top  = pos.y + 'px';
    dlg.style.visibility = 'visible';

    const ok = dlg.querySelector('#okBtn');
    ok.addEventListener('click', ()=>{
      dlg.remove();
      index++;
      if(index >= order.length){
        nextOrder();
      }
      renderDialogByIndex(index);
    });

    dlg.addEventListener('pointerdown', ()=>{
      dlg.style.zIndex = (++zTop).toString();
    });

    attachDrag(dlg, 1); // constrained to stay 100% visible
    ok.focus({preventScroll:true});
  }

  function attachDrag(dlg, minFrac){
    const bar = dlg.firstElementChild; // title bar
    let dragging=false, offX=0, offY=0, wW=0, wH=0;

    function measure(){
      const r = dlg.getBoundingClientRect();
      wW = r.width || 320;
      wH = r.height || 180;
    }

    bar.style.touchAction = 'none';

    bar.addEventListener('pointerdown', (e)=>{
      dragging = true;
      dlg.setPointerCapture(e.pointerId);
      measure();
      const rect = dlg.getBoundingClientRect();
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      dlg.style.zIndex = (++zTop).toString();
    });

    bar.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      const b = computeBoundsForMinVisibility(wW, wH, minFrac || 1);
      const x = clamp(e.clientX - offX, b.minX, b.maxX);
      const y = clamp(e.clientY - offY, b.minY, b.maxY);
      dlg.style.left = x + 'px';
      dlg.style.top  = y + 'px';
    });

    bar.addEventListener('pointerup', (e)=>{
      dragging = false;
      try{ dlg.releasePointerCapture(e.pointerId); }catch(_){}
    });
  }

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      const ok = stage.querySelector('.dlg #okBtn');
      if(ok){
        e.preventDefault();
        ok.click();
      }
    }
  });

  nextOrder();
  renderDialogByIndex(index);
})();
</script>
</body>
</html>
